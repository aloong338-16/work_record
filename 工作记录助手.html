}

}

/* ---------- buttons ---------- */
.btn{

}
.input:focus,.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);
}
.field textarea{resize:none; line-height:1.6; min-height:64px; max-height:240px; overflow-y:auto}
.seg{display:inline-flex; background:var(--surface-2); border-radius:10px; padding:3px; gap:2px}

.check{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-2); cursor:pointer}
.check input{accent-color:var(--accent); width:15px; height:15px}
.switch{position:relative; display:inline-block; width:40px; height:22px; flex-shrink:0}

.switch i::before{content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::before{transform:translateX(18px)}

/* ---------- auth ---------- */
.auth-screen{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; overflow:auto; background:var(--bg)}
.auth-bg{position:fixed; inset:0; pointer-events:none; overflow:hidden}
.auth-bg::before,.auth-bg::after{content:""; position:absolute; border-radius:50%; filter:blur(90px); opacity:.5}
.auth-bg::before{width:520px; height:520px; background:radial-gradient(circle,rgba(76,110,245,.55),transparent 65%); top:-160px; right:-100px}
.auth-bg::after{width:460px; height:460px; background:radial-gradient(circle,rgba(34,184,207,.4),transparent 65%); bottom:-140px; left:-100px}
html.dark .auth-bg::before{opacity:.35}
html.dark .auth-bg::after{opacity:.28}
.auth-card{
  position:relative; width:min(400px,calc(100vw - 32px)); background:var(--surface);
  border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow-lg); padding:30px 28px 24px;
}
.auth-logo{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px}

.app-shell{display:flex; min-height:100vh}
.sidebar{

}
.brand{display:flex; align-items:center; gap:10px; padding:0 8px 18px}
.brand strong{font-size:17px; letter-spacing:.5px; display:block; line-height:1.2}
.brand small{font-size:11px; color:var(--ink-3); display:block}
.nav{display:flex; flex-direction:column; gap:4px; flex:1}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px;
  color:var(--ink-2); font-size:14px; transition:background-color .15s,color .15s; text-align:left;
}
.nav-item:hover{background:var(--surface-2); color:var(--ink)}
.nav-item.active{background:var(--accent); color:#fff; font-weight:600; box-shadow:0 4px 14px -6px rgba(76,110,245,.55)}
.nav-item.active:hover{background:var(--accent-hover); color:#fff}
.nav-item.active .nav-badge{background:#fff; color:var(--accent)}
.nav-badge{

  background:var(--accent); color:#fff; font-size:11px; font-weight:600;
  display:inline-flex; align-items:center; justify-content:center; font-style:normal;
}
.sidebar-foot{border-top:1px solid var(--border); padding-top:12px; display:flex; flex-direction:column; gap:10px}
.user-row{display:flex; align-items:center; gap:9px; padding:0 6px}
.avatar{

  display:inline-flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; flex-shrink:0;
}
.user-row span:last-child{font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.foot-actions{display:flex; gap:4px; padding:0 2px}
.main{flex:1; min-width:0; padding:26px 32px 48px; max-width:calc(880px + 64px); margin:0 auto; width:100%}
.view-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:18px}
.view-head .sub{color:var(--ink-3); font-size:13px; margin-top:4px}

/* ---------- cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:18px 20px; margin-bottom:16px; transition:background-color .25s,border-color .25s;
}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.card-head h2,.card-title{display:flex; align-items:center; gap:8px; font-size:15px}
.card-title{margin-bottom:14px}
.card-actions{display:flex; gap:8px; flex-wrap:wrap}

.form-grid{display:grid; grid-template-columns:1fr 1.4fr 130px 110px; gap:12px; margin-bottom:12px}
.status-row{display:flex; align-items:center; gap:12px; margin-bottom:12px}
.status-row>span{font-size:12.5px; color:var(--ink-2); font-weight:500}
.form-foot{display:flex; justify-content:flex-end; margin-top:12px}

/* ---------- stats & filters ---------- */
.stats-row{display:flex; gap:22px; padding:2px 4px 14px; flex-wrap:wrap}
.stat{display:flex; align-items:baseline; gap:6px}
.stat b{font-size:20px; font-weight:700; color:var(--ink)}
.stat span{font-size:12.5px; color:var(--ink-3)}
.filters{display:flex; flex-direction:column; gap:12px; padding:14px 16px}

}

/* ---------- entries ---------- */
.date-group{margin-bottom:18px}
.date-head{display:flex; align-items:baseline; gap:10px; margin:0 4px 8px}
.date-head strong{font-size:13.5px}
.date-head span{font-size:12px; color:var(--ink-3)}
.entry{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px 16px; margin-bottom:8px; transition:border-color .15s}
.entry:hover{border-color:var(--border-strong)}
.entry-meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:7px}
.entry-text{white-space:pre-wrap; word-break:break-word; line-height:1.7; font-size:14px}
.entry-actions{margin-left:auto; display:flex; gap:2px; opacity:0; transition:opacity .15s}
.entry:hover .entry-actions,.day-block .entry .entry-actions{opacity:1}

.chip{
  display:inline-flex; align-items:center; gap:4px; padding:2.5px 9px; border-radius:999px;
  font-size:12px; background:var(--surface-2); color:var(--ink-2); max-width:200px; overflow:hidden;
}
.chip.project{background:hsl(var(--ph) 70% 50% / .13); color:hsl(var(--ph) 72% 38%); font-weight:500}
html.dark .chip.project{color:hsl(var(--ph) 85% 70%)}
.chip.hours{color:var(--ink-3)}
.pill{padding:2.5px 9px; border-radius:999px; font-size:12px; font-weight:500}
.pill.ok{background:var(--ok-soft); color:var(--ok)}
.pill.doing{background:var(--doing-soft); color:var(--doing)}

/* ---------- report ---------- */
.report-text{
  font-family:var(--font); font-size:13.5px; line-height:1.9; white-space:pre-wrap; word-break:break-word;
  background:var(--surface-2); border:1px dashed var(--border-strong); border-radius:var(--radius-sm);
  padding:16px 18px; margin:0; max-height:440px; overflow:auto;
}
.report-foot{display:flex; align-items:center; gap:12px; margin-top:10px; min-height:20px}
.period-nav{display:flex; align-items:center; gap:10px; padding:12px 16px; flex-wrap:wrap}
.period-title{flex:1; text-align:center}
.period-title strong{font-size:15px; display:block}
.period-title span{font-size:12px; color:var(--ink-3)}
.month-input,.range-row input[type="date"]{

}
.month-input{width:132px}
.range-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; width:100%; padding-top:12px; margin-top:2px; border-top:1px dashed var(--border)}

.range-row .tilde{color:var(--ink-3)}
.bars{display:flex; flex-direction:column; gap:9px}
.bar-row{display:grid; grid-template-columns:minmax(70px,140px) 1fr auto; gap:12px; align-items:center}

.bar-track{height:10px; background:var(--surface-2); border-radius:999px; overflow:hidden}
.bar-fill{height:100%; border-radius:999px; background:hsl(var(--ph) 70% 55% / .8); transition:width .4s ease}
.bar-val{font-size:12px; color:var(--ink-3); white-space:nowrap}
.day-block{margin-bottom:14px}
.day-block:last-child{margin-bottom:0}
.day-head{display:flex; align-items:baseline; gap:10px; margin-bottom:8px}
.day-head strong{font-size:13.5px}
.day-head span{font-size:12px; color:var(--ink-3)}
.proj-details{border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:8px; background:var(--surface-2)}
.proj-details summary{
  padding:10px 14px; cursor:pointer; font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:8px;
  list-style:none; border-radius:var(--radius-sm);
}
.proj-details summary::-webkit-details-marker{display:none}
.proj-details summary::after{content:""; width:7px; height:7px; border-right:1.5px solid var(--ink-3); border-bottom:1.5px solid var(--ink-3); transform:rotate(45deg); margin-left:auto; transition:transform .15s}
.proj-details[open] summary::after{transform:rotate(-135deg)}
.proj-details summary:hover{background:var(--surface-3)}
.proj-details .inner{padding:4px 12px 12px}
.proj-details .entry{background:var(--surface)}

/* ---------- settings ---------- */
.theme-opts{display:flex; gap:10px; flex-wrap:wrap}
.theme-opt{
  display:flex; flex-direction:column; align-items:center; gap:7px; padding:14px 18px;
  border:1.5px solid var(--border-strong); border-radius:12px; color:var(--ink-2); font-size:13px; min-width:86px;
  transition:all .15s;
}
.theme-opt:hover{border-color:var(--accent)}
.theme-opt.active{border-color:var(--accent); color:var(--accent); background:var(--accent-soft); font-weight:600}
.data-status{display:flex; align-items:center; gap:8px; font-size:13.5px; margin-bottom:12px; flex-wrap:wrap}
.ds-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0}
.ds-dot.green{background:var(--ok)}
.ds-dot.amber{background:var(--doing)}
.ds-dot.red{background:var(--danger)}
.ai-fields{display:grid; grid-template-columns:1fr; gap:12px; margin-top:14px}
.ai-fields .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.danger-zone{border:1px dashed var(--border-strong); border-radius:var(--radius-sm); padding:14px 16px; margin-top:16px; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap}
.danger-zone strong{font-size:13.5px; color:var(--danger)}
.about-list{display:flex; flex-direction:column; gap:10px; font-size:13px; color:var(--ink-2); line-height:1.7}
.about-list li{margin-left:-18px}
.kbd{background:var(--surface-2); border:1px solid var(--border-strong); border-radius:5px; padding:1px 6px; font-size:12px}

/* ---------- banner ---------- */
.banner{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 16px;
  border-radius:12px; margin-bottom:16px; font-size:13.5px;
}
.banner.info{background:var(--accent-soft); color:var(--accent); border:1px solid transparent}
.banner.warn{background:var(--doing-soft); color:var(--doing); border:1px solid transparent}
.banner .btn{margin-left:auto}
.banner .grow{flex:1; min-width:200px}

/* ---------- modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(9,13,22,.52); backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; animation:fadein .15s;
}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{
  width:min(540px,100%); max-height:calc(100vh - 60px); overflow:auto;
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  box-shadow:var(--shadow-lg); padding:22px 24px; animation:pop .18s;
}
@keyframes pop{from{opacity:0; transform:scale(.96) translateY(8px)}to{opacity:1; transform:none}}
.modal-head{margin-bottom:14px}
.modal-body{display:flex; flex-direction:column; gap:12px}
.modal-text{font-size:13.5px; color:var(--ink-2); line-height:1.8}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; margin-top:20px}
.modal .form-grid{grid-template-columns:1fr 1.4fr 130px 110px}

/* ---------- toast ---------- */
.toast-root{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; z-index:200; pointer-events:none}
.toast{
  background:var(--ink); color:var(--bg); padding:9px 18px; border-radius:999px; font-size:13.5px;
  box-shadow:var(--shadow-lg); animation:toastin .22s; max-width:min(480px,calc(100vw - 40px));
}
html.dark .toast{background:var(--surface-3); color:var(--ink); border:1px solid var(--border-strong)}
.toast.out{opacity:0; transform:translateY(6px); transition:all .3s}
@keyframes toastin{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}

/* ---------- empty ---------- */
.empty{display:flex; flex-direction:column; align-items:center; gap:8px; padding:52px 20px; text-align:center; color:var(--ink-3)}
.empty svg{opacity:.6; margin-bottom:4px}
.empty b{font-size:15px; color:var(--ink-2); font-weight:600}
.empty p{font-size:13px}
.empty .btn{margin-top:8px}

/* ---------- responsive ---------- */
@media (max-width:920px){
  .app-shell{flex-direction:column}
  .sidebar{width:100%; height:auto; position:static; flex-direction:row; align-items:center; padding:10px 14px; gap:12px}
  .brand{padding:0}
  .brand small{display:none}
  .nav{flex-direction:row; flex:1; overflow-x:auto}
  .nav-item{padding:8px 10px; font-size:13px; white-space:nowrap}

<script id="app-js">
'use strict';

/* ========== 基础工具 ========== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}
function hue(str){
  let h = 0;
  for(const ch of String(str)) h = (h * 31 + ch.codePointAt(0)) % 360;
  return h;
}
function sumHours(list){ return Math.round(list.reduce((a, e) => a + (Number(e.hours) || 0), 0) * 10) / 10; }
function pct(a, b){ return b ? Math.round(a / b * 100) : 0; }
function condense(s, max=64){
  const t = String(s || '').split('\n').map(x => x.trim()).filter(Boolean).join('；');
  return t.length > max ? t.slice(0, max) + '…' : t;
}

/* ========== 日期工具 ========== */
const WD_CN = ['日','一','二','三','四','五','六'];
function fmtDate(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function todayStr(){ return fmtDate(new Date()); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function mondayOf(d){ const x = new Date(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
function shortDate(s){ const d = parseDate(s); return String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function dateLine(d){ return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 星期${WD_CN[d.getDay()]}`; }
function dateLabel(ymd){
  const t = todayStr();
  if(ymd === t) return '今天';
  if(ymd === fmtDate(addDays(new Date(), -1))) return '昨天';
  return '周' + WD_CN[parseDate(ymd).getDay()];
}

/* ========== 图标 ========== */
const ICONS = {
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',
  auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  edit:'<path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>',
  trash:'<path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/><path d="M10 11v6M14 11v6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  chevL:'<path d="M15 18l-6-6 6-6"/>',
  chevR:'<path d="M9 18l6-6-6-6"/>',
  sparkles:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13l3.5 7v7a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-7l3.5-7z"/>'
};
function icon(name, size=15){
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ''}</svg>`;
}

/* ========== 全局状态 ========== */
const LS_KEY = 'gongji_blob_v1';
const THEME_KEY = 'gongji_theme';
const CATEGORIES = ['开发','调试','测试','会议','文档','学习','其他'];
const APP_VERSION = '1.0.0';
const fsSupported = typeof window.showSaveFilePicker === 'function';

let blob = null;
let currentUser = null;
let view = 'daily';
let dailyFilter = { range:'today', project:'', category:'', q:'' };
let weekOffset = 0, weekMode = 'week', customRange = null;
let monthY = null, monthM = null, monthMode = 'detail';
let weekAI = null, monthAI = null;
let fileHandle = null, fileConnected = false;
let backupBannerDismissed = false;
let fwTimer = null;

/* ========== 存储层 ========== */
function defaultBlob(){
  return { version:1, createdAt:Date.now(), savedAt:Date.now(),
    accounts:{}, records:{},
    settings:{ theme:localStorage.getItem(THEME_KEY) || 'auto', lastUser:'', session:null, users:{}, lastExportAt:0 } };
}
function migrate(b){
  if(!b || typeof b !== 'object') return defaultBlob();
  b.version = 1;
  b.accounts = b.accounts || {};
  b.records = b.records || {};
  b.settings = b.settings || {};
  b.settings.users = b.settings.users || {};
  if(b.settings.theme == null) b.settings.theme = localStorage.getItem(THEME_KEY) || 'auto';
  if(b.settings.lastExportAt == null) b.settings.lastExportAt = 0;
  b.savedAt = b.savedAt || 0;
  return b;
}
function loadLS(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    const b = JSON.parse(raw);
    return (b && b.accounts) ? b : null;
  }catch(e){ return null; }
}
function saveLS(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(blob)); }
  catch(e){ toast('浏览器本地保存失败：' + e.message, 'error'); }
}

/* IndexedDB：仅用于记住数据文件句柄 */
function idbOpen(){
  return new Promise((res, rej) => {
    const rq = indexedDB.open('gongji_idb', 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbGet(key){
  try{
    const db = await idbOpen();
    return await new Promise((res, rej) => {
      const rq = db.transaction('kv','readonly').objectStore('kv').get(key);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  }catch(e){ return undefined; }
}
async function idbSet(key, val){
  try{
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const t = db.transaction('kv','readwrite');
      t.objectStore('kv').put(val, key);
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error);
    });
  }catch(e){}
}
async function idbDel(key){
  try{
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const t = db.transaction('kv','readwrite');
      t.objectStore('kv').delete(key);
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error);
    });
  }catch(e){}
}

/* 数据文件（File System Access API） */
async function readFromFile(handle){
  try{
    const f = await handle.getFile();
    const txt = await f.text();
    if(!txt.trim()) return null;
    const b = JSON.parse(txt);
    return (b && b.accounts) ? b : null;
  }catch(e){ return null; }
}
async function writeToFileNow(){
  if(!fileHandle || !fileConnected) return;
  try{
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(blob, null, 2));
    await w.close();
  }catch(e){
    fileConnected = false;
    toast('写入数据文件失败：' + (e.message || e), 'error');
    showReconnectBanner();
  }
}
function scheduleFileWrite(){
  if(!fileHandle || !fileConnected) return;
  clearTimeout(fwTimer);
  fwTimer = setTimeout(writeToFileNow, 800);
}
async function syncFromFile(){
  const fb = await readFromFile(fileHandle);
  if(!fb){ await writeToFileNow(); return; }
  const ls = loadLS();
  /* 文件与浏览器缓存各有一份时，取更新时间较新的一份，避免丢数据 */
  const pick = !ls ? fb : ((fb.savedAt || 0) >= (ls.savedAt || 0) ? fb : ls);
  blob = migrate(pick);
}
async function restoreFileHandle(){
  if(!fsSupported) return;
  try{
    const h = await idbGet('fileHandle');
    if(!h) return;
    fileHandle = h;
    const perm = await h.queryPermission({ mode:'readwrite' });
    if(perm === 'granted'){ fileConnected = true; await syncFromFile(); }
  }catch(e){ fileHandle = null; }
}
async function bindNewFile(){
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName:'工记数据.json',
      types:[{ description:'工记数据文件', accept:{ 'application/json':['.json'] } }]
    });
    await idbSet('fileHandle', handle);
    fileHandle = handle; fileConnected = true;
    await writeToFileNow();
    clearBanner();
    toast('数据文件已绑定，此后修改会自动写入该文件', 'success');
    updateDataStatus();
    if(view === 'settings') renderSettings();
  }catch(e){
    if(e && e.name !== 'AbortError') toast('绑定失败：' + (e.message || e), 'error');
  }
}
async function bindExistingFile(){
  try{
    const [handle] = await window.showOpenFilePicker({
      types:[{ description:'工记数据文件', accept:{ 'application/json':['.json'] } }]
    });
    const fb = await readFromFile(handle);
    if(fb){
      const ls = loadLS();
      const fileNewer = !ls || (fb.savedAt || 0) >= (ls.savedAt || 0);
      if(fileNewer){ blob = migrate(fb); toast('已载入数据文件中的数据（文件较新）', 'success'); }
      else toast('本机数据较新，将覆盖写入所选文件', 'info');
    }
    await idbSet('fileHandle', handle);
    fileHandle = handle; fileConnected = true;
    commit();
    await writeToFileNow();
    clearBanner();
    toast('数据文件绑定成功', 'success');
    updateDataStatus();
    if(view === 'settings') renderSettings();
  }catch(e){
    if(e && e.name !== 'AbortError') toast('绑定失败：' + (e.message || e), 'error');
  }
}
async function unbindFile(){
  await idbDel('fileHandle');
  fileHandle = null; fileConnected = false;
  toast('已断开数据文件，数据仍保存在浏览器中', 'info');
  updateDataStatus();
  if(view === 'settings') renderSettings();
}
async function reconnectFile(){
  if(!fileHandle) return;
  try{
    const p = await fileHandle.requestPermission({ mode:'readwrite' });
    if(p === 'granted'){
      fileConnected = true;
      await syncFromFile();
      clearBanner();
      toast('数据文件已重新连接', 'success');
      updateDataStatus();
      if(view !== 'settings') renderView();
    }else toast('未获得文件读写权限', 'error');
  }catch(e){ toast('重新连接失败：' + (e.message || e), 'error'); }
}

/* 提交：内存 → 浏览器 → 数据文件 */
function commit(){
  blob.savedAt = Date.now();
  saveLS();
  scheduleFileWrite();
  refreshApp();
}

/* ========== 导入 / 导出 ========== */
function exportBackup(){
  const data = JSON.stringify(blob, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type:'application/json' }));
  a.download = '工记备份_' + todayStr().replace(/-/g,'') + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  blob.settings.lastExportAt = Date.now();
  saveLS();
  updateDataStatus();
  toast('备份已导出', 'success');
}
function mergeBlob(imp){
  Object.entries(imp.accounts || {}).forEach(([k, v]) => { if(!blob.accounts[k]) blob.accounts[k] = v; });
  Object.entries(imp.records || {}).forEach(([k, list]) => {
    const cur = blob.records[k] || (blob.records[k] = []);
    const map = new Map(cur.map(e => [e.id, e]));
    (list || []).forEach(e => {
      const ex = map.get(e.id);
      if(!ex || (e.updatedAt || 0) > (ex.updatedAt || 0)) map.set(e.id, e);
    });
    blob.records[k] = Array.from(map.values());
  });
  Object.entries((imp.settings && imp.settings.users) || {}).forEach(([k, v]) => {
    blob.settings.users[k] = Object.assign(blob.settings.users[k] || {}, v);
  });
  commit();
}
function importChoiceModal(imp){
  const n = Object.keys(imp.accounts || {}).length;
  openModal(`
    <div class="modal-head"><h3>导入数据</h3></div>
    <div class="modal-body">
      <p class="modal-text">备份文件中包含 ${n} 个账号。请选择导入方式：</p>
      <p class="modal-text"><strong>合并导入</strong>：保留现有数据，按记录 ID 去重合并（推荐）。<br><strong>替换导入</strong>：清空当前全部数据，完全使用备份文件内容。</p>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="imp-cancel">取消</button>
      <button class="btn ghost" id="imp-merge">合并导入</button>
      <button class="btn danger" id="imp-replace">替换导入</button>
    </div>`);
  $('#imp-cancel').onclick = closeModal;
  $('#imp-merge').onclick = () => { mergeBlob(imp); closeModal(); toast('合并导入完成', 'success'); };
  $('#imp-replace').onclick = () => {
    confirmModal({
      title:'确认替换全部数据？',
      body:'当前所有账号与记录将被备份文件覆盖，且无法恢复。',
      danger:true, okText:'替换',
      onOk:() => {
        blob = migrate(imp); blob.savedAt = Date.now();
        saveLS(); scheduleFileWrite();
        if(!blob.accounts[currentUser]){ currentUser = null; showAuth(); }
        else refreshApp();
        toast('已替换为备份数据', 'success');
      }
    });
  };
}

/* ========== 主题 ========== */
function applyTheme(){
  const t = currentTheme();
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
  localStorage.setItem(THEME_KEY, t);
}
function currentTheme(){ return (blob && blob.settings.theme) || localStorage.getItem(THEME_KEY) || 'auto'; }
function setTheme(t){
  if(blob) blob.settings.theme = t;
  localStorage.setItem(THEME_KEY, t);
  applyTheme();
  saveLS();
  if(view === 'settings') renderSettings();
}
function cycleTheme(){
  const order = ['auto','light','dark'];
  const cur = currentTheme();
  const next = order[(order.indexOf(cur) + 1) % order.length];
  setTheme(next);
  const label = { auto:'跟随系统', light:'亮色', dark:'深色' }[next];
  updateThemeBtn();
  toast('主题：' + label, 'info');
}
function updateThemeBtn(){
  const t = currentTheme();
  $('#theme-btn').innerHTML = icon(t === 'dark' ? 'moon' : t === 'light' ? 'sun' : 'auto', 17);
  $('#theme-btn').title = '当前主题：' + { auto:'跟随系统', light:'亮色', dark:'深色' }[t] + '（点击切换）';
}

/* ========== 账号与密码 ========== */
async function hashPassword(password, salt){
  const s = salt + '::' + password;
  try{
    if(window.crypto && crypto.subtle && crypto.subtle.digest){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i = 0; i < s.length; i++){
    const ch = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 'f' + (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);
}

  const salt = uid().replace(/-/g,'');

function projectsOf(list){
  return Array.from(new Set(list.map(e => e.project || '未分类'))).sort();
}
function inRange(e, start, end){
  return e.date >= fmtDate(start) && e.date <= fmtDate(end);
}
function filteredRecords(){
  let list = myRecords();
  if(dailyFilter.range === 'today'){
    const t = todayStr();
    list = list.filter(e => e.date === t);
  }else if(dailyFilter.range === 'week'){
    const [s, e] = thisWeekRange();
    list = list.filter(x => inRange(x, s, e));
  }else if(dailyFilter.range === 'month'){
    const [s, e] = thisMonthRange();
    list = list.filter(x => inRange(x, s, e));
  }
  if(dailyFilter.project) list = list.filter(x => (x.project || '未分类') === dailyFilter.project);
  if(dailyFilter.category) list = list.filter(x => x.category === dailyFilter.category);
  if(dailyFilter.q){
    const q = dailyFilter.q.toLowerCase();
    list = list.filter(x => (x.content + '\n' + (x.project || '')).toLowerCase().includes(q));
  }
  return list;
}
function thisWeekRange(){
  const s = mondayOf(new Date());
  return [s, addDays(s, 6)];
}
function thisMonthRange(){
  const n = new Date();
  return [new Date(n.getFullYear(), n.getMonth(), 1), new Date(n.getFullYear(), n.getMonth() + 1, 0)];
}
function currentWeek(){
  if(weekMode === 'custom' && customRange) return [parseDate(customRange.start), parseDate(customRange.end)];

}
function currentMonth(){
  if(monthY == null){ const n = new Date(); monthY = n.getFullYear(); monthM = n.getMonth() + 1; }

/* ========== 统计聚合 ========== */
function projStats(entries){
  const m = new Map();
  entries.forEach(e => {
    const p = e.project || '未分类';
    if(!m.has(p)) m.set(p, { project:p, count:0, hours:0, items:[] });
    const s = m.get(p);
    s.count++; s.hours += Number(e.hours) || 0; s.items.push(e);
  });
  const arr = Array.from(m.values());
  arr.forEach(s => {
    s.hours = Math.round(s.hours * 10) / 10;
    s.items.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt || 0) - (b.createdAt || 0));
  });
  arr.sort((a, b) => b.count - a.count);
  return arr;
}
function catStats(entries){
  const m = new Map();
  entries.forEach(e => { const c = e.category || '其他'; m.set(c, (m.get(c) || 0) + 1); });
  return Array.from(m.entries()).sort((a, b) => b[1] - a[1]);
}
function barsHtml(st){
  if(!st.length) return '<p class="hint">暂无数据</p>';
  const max = Math.max(...st.map(s => s.hours || s.count), 1);
  return `<div class="bars">${st.map(s => {
    const v = s.hours || s.count;
    return `<div class="bar-row">
      <span class="bar-name">${esc(s.project)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(v / max * 100, 2)}%;--ph:${hue(s.project)}"></div></div>
      <span class="bar-val">${s.hours ? s.hours + 'h · ' : ''}${s.count} 条</span>
    </div>`;
  }).join('')}</div>`;
}

function weeklyText(entries, start, end, label = '周报'){
  const a = fmtDate(start), b = fmtDate(end);
  const L = [`【${label}】${a} ~ ${b}`];
  if(!entries.length){ L.push(''); L.push('本周暂无工作记录。'); return L.join('\n'); }
  const total = entries.length;
  const hours = sumHours(entries);
  const ps = projStats(entries);
  const cnOrd = '一二三四五六七八九十';
  L.push('');
  L.push(`■ 本周概览：共 ${total} 条记录 · 约 ${hours} 小时 · 涉及 ${ps.length} 个项目`);
  L.push(`■ 项目投入：${ps.map(s => `${s.project} ${s.hours || 0}h`).join(' · ')}`);
  ps.forEach((s, i) => {
    L.push('');
    L.push(`${i < 10 ? cnOrd[i] : i + 1}、${s.project}（${s.count} 条 · ${s.hours || 0}h）`);
    s.items.forEach((e, j) => {
      L.push(`  ${j + 1}. [${shortDate(e.date)} 周${WD_CN[parseDate(e.date).getDay()]}·${e.category || '其他'}] ${condense(e.content)}`);
    });
  });
  const doing = entries.filter(e => e.status !== '已完成');
  L.push('');
  if(doing.length){
    L.push('■ 进行中 / 待跟进');
    doing.forEach(e => L.push(`  · [${e.project || '未分类'}] ${condense(e.content)}`));
  }else{
    L.push('■ 本周记录的事项均已完成');
  }
  return L.join('\n');
}
function renderWeekly(){

  const isCustom = weekMode === 'custom';
  const isThisWeek = !isCustom && weekOffset === 0;

/* ========== 月报文字生成 ========== */
function monthlyText(entries, first, last, mode){
  const ym = `${first.getFullYear()}年${first.getMonth() + 1}月`;
  const L = [];
  if(!entries.length) return `【月度工作汇报】${ym}\n\n本月暂无工作记录。`;
  const total = entries.length;
  const hours = sumHours(entries);
  const ps = projStats(entries);
  const cs = catStats(entries);
  if(mode === 'brief'){
    L.push(`【月度汇报 · 精简版】${ym}`);
    L.push('');
    ps.forEach((s, i) => {
      const pts = s.items.slice(0, 3).map(e => condense(e.content, 36)).join('、');
      L.push(`${i + 1}. ${s.project}：完成${pts}${s.items.length > 3 ? `等 ${s.items.length} 项工作` : `（共 ${s.items.length} 项）`}，投入约 ${s.hours || 0} 小时`);
    });
    const doing = entries.filter(e => e.status !== '已完成');
    if(doing.length) L.push(`另有 ${doing.length} 项工作仍在进行中，将于下月继续推进。`);
    return L.join('\n');
  }
  L.push(`【月度工作汇报】${ym}（${fmtDate(first)} ~ ${fmtDate(last)}）`);
  L.push('');
  L.push(`一、本月概览：共 ${total} 条工作记录，累计约 ${hours} 小时，涉及 ${ps.length} 个项目。`);
  L.push(`分类分布：${cs.map(([c, n]) => `${c} ${pct(n, total)}%`).join(' · ')}`);
  L.push('');
  L.push('二、主要工作（按项目）');
  ps.forEach((s, i) => {
    L.push(`${i + 1}. ${s.project}（${s.count} 条 · ${s.hours || 0}h · 占比 ${pct(s.count, total)}%）`);
    s.items.slice(0, 8).forEach(e => L.push(`   · [${shortDate(e.date)}] ${condense(e.content)}`));
    if(s.items.length > 8) L.push(`   · ……另有 ${s.items.length - 8} 条记录`);
  });
  const doing = entries.filter(e => e.status !== '已完成');
  L.push('');
  if(doing.length){
    L.push('三、延续到下月的事项');
    doing.forEach(e => L.push(`  · [${e.project || '未分类'}] ${condense(e.content)}`));
  }else{
    L.push('三、收尾情况');
    L.push('  本月记录的事项均已完成。');
  }
  return L.join('\n');
}

/* ========== AI 润色 ========== */
async function aiChat(cfg, userText, sys){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 60000);
  try{
    const res = await fetch(cfg.baseUrl.replace(/\/+$/, '') + '/chat/completions', {
      method:'POST', signal:ctrl.signal,
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + cfg.apiKey },
      body:JSON.stringify({ model:cfg.model || 'gpt-3.5-turbo', temperature:0.4,
        messages:[{ role:'system', content:sys }, { role:'user', content:userText }] })
    });
    if(!res.ok){
      let msg = 'HTTP ' + res.status;
      try{ const j = await res.json(); if(j.error && j.error.message) msg = j.error.message; }catch(e){}
      throw new Error(msg);
    }
    const j = await res.json();
    const txt = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
    if(!txt) throw new Error('响应格式异常');
    return txt.trim();
  }finally{ clearTimeout(timer); }
}
async function runAI(kind, btn, reportText, apply){
  const cfg = currentSettings().ai;
  if(!cfg.enabled){ toast('请先在「设置 → AI 大模型」中开启并保存配置', 'info'); return; }
  if(!cfg.baseUrl || !cfg.apiKey){ toast('AI 配置不完整：请填写接口地址与 API Key', 'error'); return; }
  const old = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = icon('sparkles', 14) + '生成中…';
  try{
    const sys = kind === 'weekly'
      ? '你是一名专业的工作汇报写作助手。用户会提供一份按项目分组的一周工作记录总结，请将其改写成流畅、专业、突出成果与进展的中文周报正文：使用「本周完成」「进行中」等小节和简短分点，总字数约 200-300 字，直接输出正文内容，不要任何解释或开场白。'
      : '你是一名专业的工作汇报写作助手。用户会提供一份按项目分组的月度工作记录总结，请将其改写成适合直接粘贴到汇报 PPT 的中文月度总结：先给一句整体概括，再按项目用短句列出主要成果（每项 1-2 行），最后如有未完成事项用一句话说明。直接输出正文内容，不要任何解释。';
    const txt = await aiChat(cfg, '原始总结：\n' + reportText, sys);
    apply(txt);
    toast('AI 润色完成', 'success');
  }catch(e){
    const msg = e.name === 'AbortError' ? '请求超时' : (e instanceof TypeError ? '网络请求失败（请检查接口地址，或该接口不支持浏览器直连）' : e.message);
    toast('AI 请求失败：' + msg, 'error');
  }finally{
    btn.disabled = false;
    btn.innerHTML = old;
  }
}

    if(ub) ub.onclick = unbindFile;
  }
  $('#btn-export').onclick = exportBackup;
  $('#btn-import').onclick = () => $('#import-file').click();
  $('#btn-clear-records').onclick = () => {
    confirmModal({
      title:'清空我的全部记录？',
      body:`将删除账号「${esc(currentAccount().displayName)}」下的所有工作记录，且无法恢复。`,
      danger:true, okText:'清空', requireText:'清空',
      onOk:() => { blob.records[currentUser] = []; commit(); toast('记录已清空', 'info'); }
    });
  };
  $('#btn-del-account').onclick = () => {
    confirmModal({
      title:'注销并删除我的账号？',
      body:'将删除该账号、其全部记录与配置，且无法恢复。其他账号不受影响。',
      danger:true, okText:'删除账号', requireText:currentAccount().name,
      onOk:() => {
        delete blob.accounts[currentUser];
        delete blob.records[currentUser];
        delete blob.settings.users[currentUser];
        currentUser = null;
        blob.settings.session = null;
        commit();
        showAuth();
        toast('账号已删除', 'info');
      }
    });
  };
  $('#btn-ai-save').onclick = () => {
    const c = currentSettings().ai;
    c.enabled = $('#ai-toggle').checked;
    c.baseUrl = $('#ai-base').value.trim();
    c.apiKey = $('#ai-key').value.trim();
    c.model = $('#ai-model').value.trim();
    commit();
    toast('AI 配置已保存', 'success');
  };
  $('#btn-ai-test').onclick = async ev => {
    const btn = ev.currentTarget;
    const c = {
      enabled:true,
      baseUrl:$('#ai-base').value.trim(),
      apiKey:$('#ai-key').value.trim(),
      model:$('#ai-model').value.trim()
    };
    const st = $('#ai-test-status');
    if(!c.baseUrl || !c.apiKey){ st.textContent = '请先填写接口地址与 API Key'; return; }
    st.textContent = '测试中…';
    btn.disabled = true;
    try{
      const txt = await aiChat(c, '请只回复两个字：正常', '你是连通性测试助手。');
      st.textContent = '连接成功：' + condense(txt, 20);
    }catch(e){
      const msg = e.name === 'AbortError' ? '请求超时' : (e instanceof TypeError ? '网络失败或接口不支持浏览器直连' : e.message);
      st.textContent = '连接失败：' + msg;
    }finally{ btn.disabled = false; }
  };
  $('#btn-acc-save').onclick = () => {
    const v = $('#acc-display').value.trim();
    if(!v){ toast('显示名不能为空', 'error'); return; }
    currentAccount().displayName = v;
    commit();
    toast('显示名已更新', 'success');
  };
  $('#btn-pwd').onclick = async () => {
    const old1 = $('#pwd-old').value, nw = $('#pwd-new').value;
    if(nw.length < 4){ toast('新密码至少 4 位', 'error'); return; }
    const acc = currentAccount();
    const oldHash = await hashPassword(old1, acc.salt);
    if(oldHash !== acc.hash){ toast('当前密码不正确', 'error'); return; }
    acc.salt = uid().replace(/-/g,'');
    acc.hash = await hashPassword(nw, acc.salt);
    commit();
    $('#pwd-old').value = ''; $('#pwd-new').value = '';
    toast('密码已修改', 'success');
  };
  $('#btn-logout2').onclick = logout;
}

/* ========== 视图调度 ========== */
function updateNav(){
  $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === view));
}
function renderView(){
  updateNav();
  try {
    if(view === 'daily') buildDaily();
    else if(view === 'weekly') renderWeekly();
    else if(view === 'monthly') renderMonthly();
    else renderSettings();
  } catch(err){
    console.error('[render]', err);
    const root = $('#view-root');
    if(root) root.innerHTML = `<div class="card" style="padding:32px;text-align:center"><h2 style="margin:0 0 8px">页面渲染出错</h2><p class="sub" style="margin:0 0 16px">${String((err && err.message) || err)}</p><button class="btn primary" data-nav="v-retry">重新加载</button></div>`;
  }
  updateNav();
}
function refreshApp(){
  if(!currentUser || !blob.accounts[currentUser]) return;
  updateChrome();
  if(view === 'settings'){
    const ds = $('#ds-status');
    if(ds) ds.innerHTML = dsStatusHtml();
    const rc = $('#ds-reconnect');
    if(rc) rc.onclick = reconnectFile;
    const le = $('#last-export');
    if(le) le.textContent = lastExportText();
    return;
  }
  if(view === 'daily'){ updateDaily(); return; }
  renderView();
}
function updateChrome(){
  const badge = $('#nav-badge');
  if(badge){
    const t = todayStr();
    const n = myRecords().filter(e => e.date === t).length;
    badge.textContent = n;
    badge.style.display = n ? '' : 'none';
  }
  $('#user-name').textContent = currentAccount().displayName || currentAccount().name;
  $('#user-avatar').textContent = (currentAccount().displayName || '用').slice(0, 1);
}
function welcomeModal(){
  openModal(`
    <div class="modal-head"><h3>欢迎使用工记</h3></div>
    <div class="modal-body">
      <p class="modal-text">两个小贴士，帮你用好它：</p>
      <p class="modal-text"><strong>1. 数据只存在你的电脑上</strong> —— 浏览器本地 + 可选的数据文件，不上传任何服务器。<br><br><strong>2. 建议现在就绑定数据文件</strong>（约 10 秒）—— 这样即使清理浏览器数据，记录也安然无恙。</p>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="wc-later">稍后再说</button>
      <button class="btn primary" id="wc-bind">${fsSupported ? '去绑定数据文件' : '先导出一份备份'}</button>
    </div>`, false);
  $('#wc-later').onclick = () => { closeModal(); backupBannerDismissed = true; };
  $('#wc-bind').onclick = () => { closeModal(); backupBannerDismissed = true; if(fsSupported) bindNewFile(); else exportBackup(); };
}

/* ========== 事件绑定与启动 ========== */
function wireAuth(){
  $('#auth-tabs').addEventListener('click', e => {
    const b = e.target.closest('button');
    if(b) switchAuthTab(b.dataset.tab);
  });
  $('#login-form').addEventListener('submit', e => { e.preventDefault(); doLogin(); });
  $('#register-form').addEventListener('submit', e => { e.preventDefault(); doRegister(); });
}
function wireShell(){
  $$('.nav-item').forEach(b => b.addEventListener('click', () => {
    const target = b.dataset.view;
    if(target === view) return;
    view = target;
    if(view === 'weekly'){ weekMode = 'week'; weekOffset = 0; customRange = null; }
    if(view === 'monthly'){ const n = new Date(); monthY = n.getFullYear(); monthM = n.getMonth() + 1; }
    renderView();
  }));
  $('#theme-btn').addEventListener('click', cycleTheme);
  $('#logout-btn').addEventListener('click', logout);
  $('#view-root').addEventListener('click', e => {
    const es = e.target.closest('[data-es]');
    if(es){
      dailyFilter.range = es.dataset.es;
      const chips = $('#range-chips');
      if(chips) $$('button', chips).forEach(x => x.classList.toggle('active', x.dataset.range === dailyFilter.range));
      renderDailyList();
      return;
    }
    const btn = e.target.closest('[data-act]');
    if(!btn) return;
    const holder = btn.closest('[data-id]');
    if(!holder) return;
    const rec = myRecords().find(r => r.id === holder.dataset.id);
    if(!rec) return;
    if(btn.dataset.act === 'edit') openEntryModal(rec);
    else if(btn.dataset.act === 'del') confirmDeleteEntry(rec);
  });
  $('#view-root').addEventListener('click', e => {
    const btn = e.target.closest('[data-nav]');
    if(!btn) return;
    const act = btn.dataset.nav;
    if(act === 'w-prev' || act === 'w-next'){
      const dir = act === 'w-prev' ? -1 : 1;
      if(weekMode === 'custom' && customRange){
        const s = parseDate(customRange.start), en = parseDate(customRange.end);
        const span = Math.max(1, Math.round((en - s) / 86400000) + 1);
        s.setDate(s.getDate() + dir * span);
        en.setDate(en.getDate() + dir * span);
        customRange = { start: fmtDate(s), end: fmtDate(en) };
      } else {
        weekOffset += dir;
      }
      renderWeekly();
    } else if(act === 'w-now'){
      if(weekMode === 'custom'){ weekMode = 'week'; customRange = null; }
      weekOffset = 0;
      renderWeekly();
    } else if(act === 'wr-apply'){
      const sEl = $('#wr-start'), eEl = $('#wr-end');
      if(!sEl || !eEl || !sEl.value || !eEl.value){ toast('请先选择开始和结束日期', 'warn'); return; }
      if(parseDate(sEl.value) > parseDate(eEl.value)){ toast('开始日期不能晚于结束日期', 'warn'); return; }
      weekMode = 'custom';
      customRange = { start: sEl.value, end: eEl.value };
      renderWeekly();
    } else if(act === 'm-prev' || act === 'm-next'){
      monthM += (act === 'm-prev' ? -1 : 1);
      if(monthM < 1){ monthM = 12; monthY--; }
      if(monthM > 12){ monthM = 1; monthY++; }
      renderMonthly();
    } else if(act === 'm-now'){
      const n = new Date();
      monthY = n.getFullYear(); monthM = n.getMonth() + 1;
      renderMonthly();
    } else if(act === 'v-retry'){
      renderView();
    }
  });
  $('#view-root').addEventListener('change', e => {
    if(e.target && e.target.id === 'm-month'){
      const m = /^(\d{4})-(\d{2})$/.exec(e.target.value || '');
      if(!m) return;
      monthY = +m[1]; monthM = +m[2];
      renderMonthly();
    }
  });
  $('#modal-root').addEventListener('click', e => {
    if(e.target.classList.contains('overlay') && e.target.dataset.dismiss === '1') closeModal();
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
  $('#import-file').addEventListener('change', async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if(!f) return;
    try{
      const data = JSON.parse(await f.text());
      if(!data || typeof data !== 'object' || !data.accounts) throw new Error('文件格式不正确');
      importChoiceModal(migrate(data));
    }catch(err){ toast('导入失败：' + err.message, 'error'); }
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(currentTheme() === 'auto') applyTheme(); });
}
async function init(){
  wireAuth();
  wireShell();
  await restoreFileHandle();
  if(!blob) blob = migrate(loadLS() || defaultBlob());
  if(fileConnected) saveLS();
  const s = blob.settings.session;
  if(s && s.expires > Date.now() && blob.accounts[s.user]){
    currentUser = s.user;
    enterApp();
  }else{
    if(s){ blob.settings.session = null; saveLS(); }
    showAuth();
  }
}
document.addEventListener('DOMContentLoaded', init);
</script>
