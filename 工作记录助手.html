.toast-root{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; z-index:200; pointer-events:none}
.toast{
  background:var(--ink); color:var(--bg); padding:9px 18px; border-radius:999px; font-size:13.5px;
  box-shadow:var(--shadow-lg); animation:toastin .22s; max-width:min(480px,calc(100vw - 40px));
}
html.dark .toast{background:var(--surface-3); color:var(--ink); border:1px solid var(--border-strong)}
.toast.out{opacity:0; transform:translateY(6px); transition:all .3s}
@keyframes toastin{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}

/* ---------- empty ---------- */
.empty{display:flex; flex-direction:column; align-items:center; gap:8px; padding:52px 20px; text-align:center; color:var(--ink-3)}
.empty svg{opacity:.6; margin-bottom:4px}
.empty b{font-size:15px; color:var(--ink-2); font-weight:600}
.empty p{font-size:13px}
.empty .btn{margin-top:8px}

/* ---------- responsive ---------- */
@media (max-width:920px){
  .app-shell{flex-direction:column}
  .sidebar{width:100%; height:auto; position:static; flex-direction:row; align-items:center; padding:10px 14px; gap:12px}
  .brand{padding:0}
  .brand small{display:none}
  .nav{flex-direction:row; flex:1; overflow-x:auto}
  .nav-item{padding:8px 10px; font-size:13px; white-space:nowrap}
  .sidebar-foot{border:none; padding:0; flex-direction:row; align-items:center}
  .user-row span:last-child{display:none}
  .main{padding:18px 16px 40px}
  .form-grid{grid-template-columns:1fr 1fr}
  .modal .form-grid{grid-template-columns:1fr 1fr}
  .bar-row{grid-template-columns:80px 1fr auto}
  .entry-actions{opacity:1}
}
@media (max-width:560px){
  .form-grid{grid-template-columns:1fr}
  .ai-fields .row2{grid-template-columns:1fr}
  .filter-fields{flex-direction:column}
  .filter-fields select{max-width:none}
}

<script id="app-js">
'use strict';

/* ========== 基础工具 ========== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}
function hue(str){
  let h = 0;
  for(const ch of String(str)) h = (h * 31 + ch.codePointAt(0)) % 360;
  return h;
}
function sumHours(list){ return Math.round(list.reduce((a, e) => a + (Number(e.hours) || 0), 0) * 10) / 10; }
function pct(a, b){ return b ? Math.round(a / b * 100) : 0; }
function condense(s, max=64){
  const t = String(s || '').split('\n').map(x => x.trim()).filter(Boolean).join('；');
  return t.length > max ? t.slice(0, max) + '…' : t;
}

/* ========== 日期工具 ========== */
const WD_CN = ['日','一','二','三','四','五','六'];
function fmtDate(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function todayStr(){ return fmtDate(new Date()); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function mondayOf(d){ const x = new Date(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
function shortDate(s){ const d = parseDate(s); return String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function dateLine(d){ return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 星期${WD_CN[d.getDay()]}`; }
function dateLabel(ymd){
  const t = todayStr();
  if(ymd === t) return '今天';
  if(ymd === fmtDate(addDays(new Date(), -1))) return '昨天';
  return '周' + WD_CN[parseDate(ymd).getDay()];
}

/* ========== 图标 ========== */
const ICONS = {
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',
  auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  edit:'<path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>',
  trash:'<path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/><path d="M10 11v6M14 11v6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  chevL:'<path d="M15 18l-6-6 6-6"/>',
  chevR:'<path d="M9 18l6-6-6-6"/>',
  sparkles:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13l3.5 7v7a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-7l3.5-7z"/>'
};
function icon(name, size=15){
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ''}</svg>`;
}

/* ========== 全局状态 ========== */
const LS_KEY = 'gongji_blob_v1';
const THEME_KEY = 'gongji_theme';
const CATEGORIES = ['开发','BUG 修复','需求分析','代码评审','调试','测试','发布部署','运维支持','性能优化','会议','文档','学习','其他'];
const APP_VERSION = '1.1.0';
const fsSupported = typeof window.showSaveFilePicker === 'function';

let blob = null;
let currentUser = null;
let view = 'daily';
let dailyFilter = { range:'today', project:'', category:'', q:'' };
let weekOffset = 0, weekMode = 'week', customRange = null;
let monthY = null, monthM = null, monthMode = 'detail';
let weekAI = null, monthAI = null;
let fileHandle = null, fileConnected = false;
let fileOwner = null, fileTask = Promise.resolve(), lastFileSyncAt = 0, fileLegacy = false;
let backupBannerDismissed = false;
let fwTimer = null;

/* ========== 存储层 ========== */
function defaultBlob(){
  return { version:1, createdAt:Date.now(), savedAt:Date.now(),
    accounts:{}, records:{},
    settings:{ theme:localStorage.getItem(THEME_KEY) || 'auto', lastUser:'', session:null, users:{}, lastExportAt:0 } };
}
function migrate(b){
  if(!b || typeof b !== 'object') return defaultBlob();
  b.version = 1;
  b.accounts = b.accounts || {};
  b.records = b.records || {};
  b.settings = b.settings || {};
  b.settings.users = b.settings.users || {};
  Object.values(b.settings.users).forEach(u => {
    if(!u || typeof u !== 'object') return;
    if(!Array.isArray(u.categories)) u.categories = [];
    if(!u.deletedRecords || typeof u.deletedRecords !== 'object') u.deletedRecords = {};
  });
  if(b.settings.theme == null) b.settings.theme = localStorage.getItem(THEME_KEY) || 'auto';
  if(b.settings.lastExportAt == null) b.settings.lastExportAt = 0;
  b.savedAt = b.savedAt || 0;
  return b;
}
function loadLS(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    const b = JSON.parse(raw);
    return (b && b.accounts) ? b : null;
  }catch(e){ return null; }
}
function saveLS(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(blob)); }
  catch(e){ toast('浏览器本地保存失败：' + e.message, 'error'); }
}
function userSettings(user = currentUser){
  const users = blob.settings.users;
  if(!users[user] || typeof users[user] !== 'object') users[user] = {};
  const settings = users[user];
  if(!settings.ai) settings.ai = { enabled:false, baseUrl:'', apiKey:'', model:'' };
  if(!Array.isArray(settings.categories)) settings.categories = [];
  if(!settings.deletedRecords || typeof settings.deletedRecords !== 'object') settings.deletedRecords = {};
  return settings;
}
function touchSettings(){
  userSettings().updatedAt = Date.now();
}
function personalBlob(user = currentUser){
  if(!user || !blob.accounts[user]) throw new Error('请先登录后再导出个人数据');
  const settings = JSON.parse(JSON.stringify(userSettings(user)));
  return {
    version:1, owner:user, createdAt:blob.accounts[user].createdAt || blob.createdAt,
    savedAt:settings.savedAt || blob.savedAt,
    accounts:{ [user]:JSON.parse(JSON.stringify(blob.accounts[user])) },
    records:{ [user]:JSON.parse(JSON.stringify(blob.records[user] || [])) },
    settings:{ theme:settings.theme || blob.settings.theme, lastUser:user, session:null,
      users:{ [user]:settings }, lastExportAt:settings.lastExportAt || 0 }
  };
}

/* 同步按记录更新时间合并，并保留删除标记；个人偏好与草稿各自比较时间。 */
function mergeAccountData(data, user, preferIncoming = false){
  const incoming = data.accounts[user] || blob.accounts[user];
  if(!incoming) return { addedAccounts:0, addedRecords:0, updatedRecords:0 };
  const result = { addedAccounts:0, addedRecords:0, updatedRecords:0 };
  const existing = blob.accounts[user];
  if(!existing){ blob.accounts[user] = incoming; result.addedAccounts++; }
  else if((incoming.updatedAt || incoming.createdAt || 0) > (existing.updatedAt || existing.createdAt || 0)){
    blob.accounts[user] = incoming;
  }
  const local = userSettings(user), remote = Object.assign({ theme:data.settings.theme }, data.settings.users[user] || {});
  const hasRemoteSettings = Object.prototype.hasOwnProperty.call(data.settings.users, user);
  const takeRemote = (preferIncoming && hasRemoteSettings) || !existing || (remote.updatedAt || 0) > (local.updatedAt || 0);
  const merged = Object.assign({}, local, takeRemote ? remote : {});
  if(preferIncoming && hasRemoteSettings) merged.updatedAt = Date.now();
  merged.savedAt = Math.max(local.savedAt || 0, remote.savedAt || data.savedAt || 0);
  merged.deletedRecords = Object.assign({}, local.deletedRecords);
  Object.entries(remote.deletedRecords || {}).forEach(([id, time]) => {
    merged.deletedRecords[id] = Math.max(merged.deletedRecords[id] || 0, time);
  });
  if((remote.draftUpdatedAt || 0) > (local.draftUpdatedAt || 0)){
    merged.draft = remote.draft;
    merged.draftUpdatedAt = remote.draftUpdatedAt;
  }else{
    merged.draft = local.draft;
    merged.draftUpdatedAt = local.draftUpdatedAt || 0;
  }
  merged.lastExportAt = Math.max(local.lastExportAt || 0, remote.lastExportAt || 0);
  blob.settings.users[user] = merged;
  const records = new Map((blob.records[user] || []).map(record => [record.id, record]));
  (data.records[user] || []).forEach(record => {
    const previous = records.get(record.id);
    if(!previous){ records.set(record.id, record); result.addedRecords++; }
    else if((record.updatedAt || record.createdAt || 0) > (previous.updatedAt || previous.createdAt || 0)){
      records.set(record.id, record); result.updatedRecords++;
    }
  });
  blob.records[user] = Array.from(records.values()).filter(record =>
    !merged.deletedRecords[record.id] || merged.deletedRecords[record.id] < (record.updatedAt || record.createdAt || 0));
  blob.savedAt = Math.max(blob.savedAt || 0, data.savedAt || 0);
  return result;
}

/* IndexedDB：仅用于记住数据文件句柄 */
function idbOpen(){
  return new Promise((res, rej) => {
    const rq = indexedDB.open('gongji_idb', 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbGet(key){
  try{
    const db = await idbOpen();
    return await new Promise((res, rej) => {
      const rq = db.transaction('kv','readonly').objectStore('kv').get(key);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  }catch(e){ return undefined; }
}
async function idbSet(key, val){
  try{
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const t = db.transaction('kv','readwrite');
      t.objectStore('kv').put(val, key);
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error);
    });
  }catch(e){}
}
async function idbDel(key){
  try{
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const t = db.transaction('kv','readwrite');
      t.objectStore('kv').delete(key);
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error);
    });
  }catch(e){}
}

/* 数据文件（File System Access API） */
async function readFromFile(handle){
  const f = await handle.getFile();
  const txt = await f.text();
  if(!txt.trim()) return null;
  return normalizeImportData(JSON.parse(txt));
}
async function writeToFileNow(){
  const handle = fileHandle, owner = fileOwner;
  if(!handle || !fileConnected || !owner || !blob.accounts[owner]) return false;
  const action = async () => {
    if(handle !== fileHandle || owner !== fileOwner || !fileConnected) return false;
    try{
      const existing = await readFromFile(handle);
      const existingText = existing && JSON.stringify(existing);
      if(existing && !existing.accounts[owner]) throw new Error('所选文件属于其他账号，已停止写入');
      const before = JSON.stringify(personalBlob(owner));
      const draftBefore = userSettings(owner).draftUpdatedAt;
      const categoriesBefore = JSON.stringify(userSettings(owner).categories);
      if(existing) mergeAccountData(existing, owner);
      let data = personalBlob(owner);
      fileLegacy = !!existing && Object.keys(existing.accounts).length > 1;
      /* 旧版多账号文件保留其他账号，避免迁移时截断原有数据。 */
      if(existing && Object.keys(existing.accounts).length > 1){
        existing.accounts[owner] = data.accounts[owner];
        existing.records[owner] = data.records[owner];
        existing.settings.users[owner] = data.settings.users[owner];
        existing.savedAt = Math.max(existing.savedAt || 0, data.savedAt || 0);
        existing.settings.session = null;
        data = existing;
      }
      saveLS();
      if(!existing || existingText !== JSON.stringify(data)){
        const writable = await handle.createWritable();
        await writable.write(JSON.stringify(data, null, 2));
        await writable.close();
      }
      lastFileSyncAt = Date.now();
      if(currentUser === owner && before !== JSON.stringify(personalBlob(owner))){
        applyTheme();
        if(view === 'daily' && (draftBefore !== userSettings(owner).draftUpdatedAt || categoriesBefore !== JSON.stringify(userSettings(owner).categories))){
          buildDaily();
        }else refreshApp();
      }
      updateDataStatus();
      return true;
    }catch(e){
      fileConnected = false;
      toast('同步数据文件失败：' + (e.message || e), 'error');
      updateDataStatus();
      showReconnectBanner();
      return false;
    }
  };
  const task = fileTask.then(action, action);
  fileTask = task.catch(() => {});
  return task;
}
function scheduleFileWrite(){
  if(!fileHandle || !fileConnected || fileOwner !== currentUser) return;
  clearTimeout(fwTimer);
  fwTimer = setTimeout(writeToFileNow, 800);
}
async function syncFromFile(){
  return writeToFileNow();
}
async function restoreFileHandle(user = currentUser){
  if(!fsSupported || !user) return;
  try{
    let h = await idbGet('fileHandle:' + user);
    if(h === undefined){
      const legacy = await idbGet('fileHandle');
      if(legacy && await legacy.queryPermission({ mode:'readwrite' }) === 'granted'){
        const data = await readFromFile(legacy);
        if(data && data.accounts[user]){ h = legacy; await idbSet('fileHandle:' + user, h); }
      }
    }
    if(!h) return;
    fileHandle = h; fileOwner = user;
    const perm = await h.queryPermission({ mode:'readwrite' });
    if(perm === 'granted'){ fileConnected = true; await syncFromFile(); }
  }catch(e){
    fileConnected = false;
    if(fileHandle) toast('数据文件暂不可用：' + (e.message || e), 'error');
  }
}
async function bindNewFile(){
  if(!currentUser) return;
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName:'工记_' + currentAccount().name + '.json',
      types:[{ description:'工记数据文件', accept:{ 'application/json':['.json'] } }]
    });
    if(fileConnected) await writeToFileNow();
    clearTimeout(fwTimer);
    await idbSet('fileHandle:' + currentUser, handle);
    fileHandle = handle; fileOwner = currentUser; fileConnected = true;
    const written = await writeToFileNow();
    if(view === 'settings') renderSettings();
    if(!written) return;
    clearBanner();
    toast('个人 JSON 已绑定，账号、记录、分类、配置和草稿都会保存到这个文件', 'success');
    updateDataStatus();
  }catch(e){
    if(e && e.name !== 'AbortError') toast('绑定失败：' + (e.message || e), 'error');
  }
}
async function bindExistingFile(){
  try{
    const [handle] = await window.showOpenFilePicker({
      types:[{ description:'工记数据文件', accept:{ 'application/json':['.json'] } }]
    });
    if(await handle.queryPermission({ mode:'readwrite' }) !== 'granted' &&
      await handle.requestPermission({ mode:'readwrite' }) !== 'granted'){
      throw new Error('未获得文件读写权限，可改用导入个人 JSON 恢复数据');
    }
    const data = await readFromFile(handle);
    if(!data || !Object.keys(data.accounts).length) throw new Error('文件中没有可恢复的账号，请选择已有的数据 JSON');
    if(currentUser && !data.accounts[currentUser]) throw new Error('文件中没有当前账号，请退出登录后从登录页导入');
    if(!currentUser){
      for(const user of Object.keys(data.accounts)){
        mergeAccountData(data, user);
        await idbSet('fileHandle:' + user, handle);
      }
      blob.settings.lastUser = data.owner || data.settings.lastUser || Object.keys(data.accounts)[0];
      blob.settings.session = null;
      saveLS(); showAuth();
      toast('账号和数据已恢复，请使用原账号密码登录', 'success');
      return;
    }
    if(fileConnected) await writeToFileNow();
    clearTimeout(fwTimer);
    mergeAccountData(data, currentUser);
    await idbSet('fileHandle:' + currentUser, handle);
    fileHandle = handle; fileOwner = currentUser; fileConnected = true;
    saveLS(); applyTheme(); refreshApp();
    const written = await writeToFileNow();
    if(view === 'settings') renderSettings();
    if(!written) return;
    clearBanner();
    toast('用户数据 JSON 绑定成功', 'success');
    updateDataStatus();
  }catch(e){
    if(e && e.name !== 'AbortError') toast('绑定失败：' + (e.message || e), 'error');
  }
}
async function unbindFile(){
  if(fileOwner) await idbSet('fileHandle:' + fileOwner, null);
  clearTimeout(fwTimer);
  await fileTask;
  fileHandle = null; fileOwner = null; fileConnected = false; fileLegacy = false;
  toast('已断开 JSON 文件绑定；后续修改只保存在浏览器本地', 'info');
  updateDataStatus();
  if(view === 'settings') renderSettings();
}
async function reconnectFile(){
  if(!fileHandle) return;
  try{
    const p = await fileHandle.requestPermission({ mode:'readwrite' });
    if(p === 'granted'){
      fileConnected = true;
      if(!await syncFromFile()) return;
      clearBanner();
      toast('数据文件已重新连接', 'success');
      updateDataStatus();
      if(view !== 'settings') renderView();
    }else{
      fileConnected = false;
      updateDataStatus();
      toast('未获得文件读写权限', 'error');
    }
  }catch(e){ toast('重新连接失败：' + (e.message || e), 'error'); }
}

/* 导入 JSON 标准化：兼容旧备份/手动整理的账号大小写，并为缺少 ID 的记录补稳定 ID。 */
function stableImportedRecordId(owner, index, record){
  const source = String(owner) + '|' + String(index) + '|' + JSON.stringify(record);
  let h = 2166136261;
  for(let i = 0; i < source.length; i++) h = Math.imul(h ^ source.charCodeAt(i), 16777619);
  return 'import-' + (h >>> 0).toString(16);
}
function normalizeImportData(input){
  let data = input;
  if(data && typeof data === 'object' && !Array.isArray(data) && !data.accounts){
    for(const k of ['blob','data','backup']){
      if(data[k] && typeof data[k] === 'object' && data[k].accounts){ data = data[k]; break; }
    }
  }
  if(!data || typeof data !== 'object' || Array.isArray(data) || !data.accounts || typeof data.accounts !== 'object' || Array.isArray(data.accounts)){
    throw new Error('文件格式不正确：未找到有效的 accounts 账号数据');
  }
  if(data.records != null && (typeof data.records !== 'object' || Array.isArray(data.records))){
    throw new Error('文件格式不正确：records 必须是对象');
  }
  const copy = JSON.parse(JSON.stringify(data));
  const accounts = {};
  const accountKeyMap = {};
  Object.entries(copy.accounts || {}).forEach(([rawKey, account]) => {
    const key = String(rawKey).trim().toLowerCase();
    if(!key) return;
    accountKeyMap[rawKey] = key;
    if(!accounts[key]) accounts[key] = account;
  });
  const records = {};
  Object.entries(copy.records || {}).forEach(([rawKey, list]) => {
    const key = accountKeyMap[rawKey] || String(rawKey).trim().toLowerCase();
    if(!key) return;
    const rows = Array.isArray(list) ? list : (list && typeof list === 'object' ? Object.values(list) : []);
    if(!records[key]) records[key] = [];
    const startIndex = records[key].length;
    rows.forEach((row, index) => {
      const rec = row && typeof row === 'object' && !Array.isArray(row) ? Object.assign({}, row) : { content:String(row ?? '') };
      if(rec.id == null || String(rec.id).trim() === '') rec.id = stableImportedRecordId(key, startIndex + index, rec);
      else rec.id = String(rec.id);
      if(rec.updatedAt == null && rec.createdAt != null) rec.updatedAt = rec.createdAt;
      records[key].push(rec);
    });
  });
  const settings = Object.assign({}, copy.settings || {});
  const rawUserSettings = settings.users && typeof settings.users === 'object' ? settings.users : {};
  settings.users = {};
  Object.entries(rawUserSettings).forEach(([rawKey, value]) => {
    const key = String(rawKey).trim().toLowerCase();
    if(key) settings.users[key] = Object.assign(settings.users[key] || {}, value || {});
  });
  if(settings.session && settings.session.user) settings.session.user = String(settings.session.user).trim().toLowerCase();
  if(settings.lastUser) settings.lastUser = String(settings.lastUser).trim().toLowerCase();
  if(copy.owner) copy.owner = String(copy.owner).trim().toLowerCase();
  return migrate(Object.assign({}, copy, { accounts, records, settings }));
}
function mergeBlob(imp){
  const result = { addedAccounts:0, addedRecords:0, updatedRecords:0 };
  new Set([...Object.keys(imp.accounts || {}), ...Object.keys(imp.records || {})]).forEach(user => {
    const counts = mergeAccountData(imp, user, true);
    Object.keys(result).forEach(key => { result[key] += counts[key]; });
  });
  commit();
  return result;
}
function importChoiceModal(imp){
  const n = Object.keys(imp.accounts || {}).length;
  const totalRecords = Object.values(imp.records || {}).reduce((sum, rows) => sum + (Array.isArray(rows) ? rows.length : 0), 0);
  openModal(`
    <div class="modal-head"><h3>导入数据</h3></div>
    <div class="modal-body">
      <p class="modal-text">检测到 ${n} 个账号、${totalRecords} 条工作记录。请选择导入方式：</p>
      <p class="modal-text"><strong>合并导入</strong>：保留本机数据，按记录 ID 去重合并；旧记录缺少 ID 时会自动补齐（推荐）。<br><strong>替换导入</strong>：清空本机全部数据，完全使用备份文件内容。</p>
      <p class="hint">记录按账号归属导入。若导入后当前页面没有显示新记录，请退出并登录备份文件中对应的账号。</p>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="imp-cancel">取消</button>
      <button class="btn ghost" id="imp-merge">合并导入</button>
      <button class="btn danger" id="imp-replace">替换导入</button>
    </div>`);
  $('#imp-cancel').onclick = closeModal;
  $('#imp-merge').onclick = () => {
    try{
      const result = mergeBlob(imp);
      closeModal();
      if(!currentUser){
        blob.settings.lastUser = imp.owner || imp.settings.lastUser || Object.keys(imp.accounts)[0];
        blob.settings.session = null;
        saveLS(); showAuth();
      }
      toast(`导入完成：新增 ${result.addedAccounts} 个账号、${result.addedRecords} 条记录，更新 ${result.updatedRecords} 条`, 'success');
    }catch(err){ toast('合并导入失败：' + (err.message || err), 'error'); }
  };
  $('#imp-replace').onclick = () => {
    confirmModal({
      title:'确认替换全部数据？',
      body:'当前所有账号与记录将被备份文件覆盖，且无法恢复。',
      danger:true, okText:'替换',
      onOk:() => {
        try{
          const activeUser = currentUser;
          const previousSession = blob.settings && blob.settings.session;
          const previousRecords = activeUser ? (blob.records[activeUser] || []).slice() : [];
          blob = migrate(JSON.parse(JSON.stringify(imp)));
          const targetUser = (activeUser && blob.accounts[activeUser]) ? activeUser : null;
          currentUser = targetUser;
          if(targetUser){
            blob.settings.lastUser = targetUser;
            blob.settings.session = previousSession && previousSession.user === targetUser ? previousSession : null;
            const retained = new Set((blob.records[targetUser] || []).map(record => record.id));
            previousRecords.forEach(record => {
              if(!retained.has(record.id)){
                userSettings().deletedRecords[record.id] = Math.max(Date.now(), (record.updatedAt || record.createdAt || 0) + 1);
              }
            });
            touchSettings();
            userSettings().draftUpdatedAt = Date.now();
            currentAccount().updatedAt = Date.now();
          }else{
            blob.settings.session = null;
            clearTimeout(fwTimer);
            fileHandle = null; fileOwner = null; fileConnected = false; fileLegacy = false;
          }
          applyTheme();
          commit();
          if(currentUser) enterApp(); else showAuth();
          toast('已替换为备份数据', 'success');
        }catch(err){ toast('替换导入失败：' + (err.message || err), 'error'); }
      }
    });
  };
}

function applyTheme(){
  const t = currentTheme();
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
  localStorage.setItem(THEME_KEY, t);
}
function currentTheme(){
  return (currentUser && userSettings().theme) || (blob && blob.settings.theme) || localStorage.getItem(THEME_KEY) || 'auto';
}
function setTheme(t){
  if(blob) blob.settings.theme = t;
  if(currentUser){ userSettings().theme = t; touchSettings(); }
  localStorage.setItem(THEME_KEY, t);
  applyTheme();
  persistUserState();
  updateThemeBtn();
  if(view === 'settings') renderSettings();
}
function cycleTheme(){
  const order = ['auto','light','dark'];
  const cur = currentTheme();
  const next = order[(order.indexOf(cur) + 1) % order.length];
  setTheme(next);
  const label = { auto:'跟随系统', light:'亮色', dark:'深色' }[next];
  updateThemeBtn();
  toast('主题：' + label, 'info');
}
function updateThemeBtn(){
  const t = currentTheme();

}

/* ========== 账号与密码 ========== */
async function hashPassword(password, salt){
  const s = salt + '::' + password;
  try{
    if(window.crypto && crypto.subtle && crypto.subtle.digest){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i = 0; i < s.length; i++){
    const ch = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 'f' + (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);
}
function currentAccount(){ return blob.accounts[currentUser]; }
function currentSettings(){
  return userSettings();
}
function myRecords(){ return blob.records[currentUser] || (blob.records[currentUser] = []); }

async function doLogin(){
  const name = $('#login-user').value.trim();
  const pwd = $('#login-pass').value;
  const key = name.toLowerCase();
  const acc = blob.accounts[key];
  if(!acc){ toast('账号不存在，请先注册', 'error'); return; }
  const hash = await hashPassword(pwd, acc.salt);
  if(hash !== acc.hash){ toast('密码错误', 'error'); $('#auth-card').classList.remove('shake'); void $('#auth-card').offsetWidth; $('#auth-card').classList.add('shake'); return; }
  await loginAs(key, $('#login-remember').checked);
}
async function doRegister(){
  const name = $('#reg-user').value.trim();
  const display = $('#reg-display').value.trim() || name;
  const pwd = $('#reg-pass').value, pwd2 = $('#reg-pass2').value;
  if(!/^[\u4e00-\u9fa5a-zA-Z0-9_]{2,20}$/.test(name)){ toast('用户名需为 2-20 位字母、数字、中文或下划线', 'error'); return; }
  if(pwd.length < 4){ toast('密码至少 4 位', 'error'); return; }
  if(pwd !== pwd2){ toast('两次输入的密码不一致', 'error'); return; }
  const key = name.toLowerCase();
  if(blob.accounts[key]){ toast('该用户名已被注册', 'error'); return; }
  const salt = uid().replace(/-/g,'');
  const hash = await hashPassword(pwd, salt);
  blob.accounts[key] = { name, salt, hash, displayName:display, createdAt:Date.now() };
  blob.records[key] = [];
  blob.settings.users[key] = { ai:{ enabled:false, baseUrl:'', apiKey:'', model:'' } };
  await loginAs(key, true);
  welcomeModal();
}
async function loginAs(key, remember){
  if(fileConnected) await writeToFileNow();
  clearTimeout(fwTimer);
  await fileTask;
  fileHandle = null; fileOwner = null; fileConnected = false; fileLegacy = false;
  currentUser = key;
  dailyFilter = { range:'today', project:'', category:'', q:'' };
  weekAI = null; monthAI = null; backupBannerDismissed = false;
  await restoreFileHandle(key);
  blob.settings.session = remember ? { user:key, expires:Date.now() + 30 * 864e5 } : null;
  blob.settings.lastUser = key;
  commit();
  applyTheme();
  enterApp();
}
async function logout(){
  if(currentUser && view === 'daily') saveDailyDraft();
  clearTimeout(fwTimer);
  if(fileConnected) await writeToFileNow();
  await fileTask;
  fileHandle = null; fileOwner = null; fileConnected = false; fileLegacy = false;
  currentUser = null;
  blob.settings.session = null;
  commit();
  showAuth();
  clearBanner();
  toast('已退出登录', 'info');
}
function showAuth(){
  $('#app-shell').classList.add('hidden');
  $('#auth-screen').classList.remove('hidden');
  const hasAccounts = Object.keys(blob.accounts).length > 0;
  switchAuthTab(hasAccounts ? 'login' : 'register');
  if(hasAccounts && blob.settings.lastUser) $('#login-user').value = blob.settings.lastUser;
  $('#login-pass').value = '';
  $('#auth-data-status').textContent = '已有数据文件可直接导入，再用原账号密码登录。未绑定 JSON 的账号只保存在此浏览器。';
}
function switchAuthTab(tab){
  $$('#auth-tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  $('#login-form').classList.toggle('hidden', tab !== 'login');
  $('#register-form').classList.toggle('hidden', tab !== 'register');
  if(tab === 'login' && blob.settings.lastUser) $('#login-user').value = blob.settings.lastUser;
}
function enterApp(){
  $('#auth-screen').classList.add('hidden');
  $('#app-shell').classList.remove('hidden');
  view = 'daily';
  updateThemeBtn();
  renderView();
  updateChrome();
  if(fileHandle && !fileConnected) showReconnectBanner();
  else maybeBackupBanner();
}

/* ========== 通用 UI ========== */
function toast(msg, type='info'){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  $('#toast-root').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 2600);
}
function openModal(html, dismissable=true){
  $('#modal-root').innerHTML = `<div class="overlay" data-dismiss="${dismissable ? 1 : 0}"><div class="modal">${html}</div></div>`;
}
function closeModal(){ $('#modal-root').innerHTML = ''; }
function confirmModal({ title, body='', danger=false, okText='确认', cancelText='取消', requireText=null, onOk }){
  openModal(`
    <div class="modal-head"><h3>${esc(title)}</h3></div>
    <div class="modal-body">
      ${body ? `<p class="modal-text">${body}</p>` : ''}
      ${requireText ? `<input id="confirm-input" class="input" placeholder='输入「${esc(requireText)}」以确认'>` : ''}
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="confirm-cancel">${esc(cancelText)}</button>
      <button class="btn ${danger ? 'danger' : 'primary'}" id="confirm-ok" ${requireText ? 'disabled' : ''}>${esc(okText)}</button>
    </div>`);
  const inp = $('#confirm-input');
  if(inp) inp.addEventListener('input', () => { $('#confirm-ok').disabled = inp.value.trim() !== requireText; });
  $('#confirm-cancel').onclick = closeModal;
  $('#confirm-ok').onclick = () => { closeModal(); if(onOk) onOk(); };
  if(inp) inp.focus();
}
function banner(html, cls='info'){
  $('#banner-root').innerHTML = `<div class="banner ${cls}">${html}</div>`;
}
function clearBanner(){ $('#banner-root').innerHTML = ''; }
function showReconnectBanner(){
  if($('#app-shell').classList.contains('hidden')) return;
  banner(`<span>${icon('link', 16)}</span><span class="grow">数据文件连接待恢复，重新授权后可继续自动保存</span><button class="btn primary sm" id="bn-reconnect">重新连接</button>`, 'warn');

function maybeBackupBanner(){

  banner(`
    <span class="grow">当前账号仅保存在此浏览器，尚未绑定 JSON 文件。</span>
    <button class="btn primary sm" id="bn-bind">绑定数据文件</button>
    <button class="btn ghost sm" id="bn-export">导出备份</button>

function segVal(id){
  const a = $('#' + id) && $('#' + id).querySelector('.active');
  return a ? a.dataset.v : '';

function wireSeg(id){
  const el = $('#' + id);
  if(!el) return;
  el.addEventListener('click', e => {
    const b = e.target.closest('button');
    if(!b) return;
    $$('button', el).forEach(x => x.classList.toggle('active', x === b));
  });

function copyText(t){
  const ok = () => toast('已复制到剪贴板，可直接粘贴到 PPT / 文档', 'success');
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); ok(); }
    catch(e){ toast('复制失败，请手动选择文本复制', 'error'); }
    ta.remove();
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(ok).catch(fallback);
  }else fallback();
}

/* ========== 记录视图 ========== */
function categoryNames(includeRecords = false){
  const names = [...CATEGORIES.filter(name => name !== '其他'), ...currentSettings().categories];
  if(includeRecords) names.push(...myRecords().map(record => record.category));
  return Array.from(new Set(names.filter(name => typeof name === 'string' && name.trim()).map(name => name.trim()))).filter(name => name !== '其他').concat('其他');
}
function categoryOptions(selected = CATEGORIES[0], includeRecords = false){
  const names = categoryNames(includeRecords);
  if(selected && !names.includes(selected)) names.splice(names.length - 1, 0, selected);
  return names.map(name => `<option value="${esc(name)}" ${name === selected ? 'selected' : ''}>${esc(name)}</option>`).join('');
}
function customCategoryHtml(prefix){
  return `<div class="category-custom" id="${prefix}-category-custom" hidden>
    <label class="field"><span>自定义分类（可选）</span><input id="${prefix}-category-name" maxlength="40" placeholder="输入分类名称"></label>
    <label class="check"><input type="checkbox" id="${prefix}-category-remember">保存到我的分类</label>
  </div>`;
}
function wireCategory(prefix, onChange = () => {}){
  const select = $('#' + prefix + '-category');
  select.addEventListener('change', () => {
    $('#' + prefix + '-category-custom').hidden = select.value !== '其他';
    onChange();
  });
  $('#' + prefix + '-category-name').addEventListener('input', onChange);
  $('#' + prefix + '-category-remember').addEventListener('change', onChange);
  $('#' + prefix + '-category-custom').hidden = select.value !== '其他';
}
function selectedCategory(prefix){
  const selected = $('#' + prefix + '-category').value;
  return selected === '其他' ? ($('#' + prefix + '-category-name').value.trim() || '其他') : selected;
}
function rememberCategory(prefix, name){
  if(!$('#' + prefix + '-category-remember').checked || CATEGORIES.includes(name)) return;
  const settings = currentSettings();
  if(!settings.categories.includes(name)){ settings.categories.push(name); touchSettings(); }
}
function projectsOf(list){
  return Array.from(new Set(list.map(e => e.project || '未分类'))).sort();
}
function inRange(e, start, end){
  return e.date >= fmtDate(start) && e.date <= fmtDate(end);
}
function filteredRecords(){
  let list = myRecords();
  if(dailyFilter.range === 'today'){
    const t = todayStr();
    list = list.filter(e => e.date === t);
  }else if(dailyFilter.range === 'week'){
    const [s, e] = thisWeekRange();
    list = list.filter(x => inRange(x, s, e));
  }else if(dailyFilter.range === 'month'){
    const [s, e] = thisMonthRange();
    list = list.filter(x => inRange(x, s, e));
  }
  if(dailyFilter.project) list = list.filter(x => (x.project || '未分类') === dailyFilter.project);
  if(dailyFilter.category) list = list.filter(x => x.category === dailyFilter.category);
  if(dailyFilter.q){
    const q = dailyFilter.q.toLowerCase();
    list = list.filter(x => (x.content + '\n' + (x.project || '')).toLowerCase().includes(q));
  }
  return list;
}
function thisWeekRange(){
  const s = mondayOf(new Date());
  return [s, addDays(s, 6)];
}
function thisMonthRange(){
  const n = new Date();
  return [new Date(n.getFullYear(), n.getMonth(), 1), new Date(n.getFullYear(), n.getMonth() + 1, 0)];
}
function currentWeek(){
  if(weekMode === 'custom' && customRange) return [parseDate(customRange.start), parseDate(customRange.end)];
  const start = addDays(mondayOf(new Date()), weekOffset * 7);
  return [start, addDays(start, 6)];
}
function currentMonth(){
  if(monthY == null){ const n = new Date(); monthY = n.getFullYear(); monthM = n.getMonth() + 1; }
  return [new Date(monthY, monthM - 1, 1), new Date(monthY, monthM, 0)];
}

/* 工作记录草稿：切换页面或重新渲染时保留尚未保存的输入 */
function dailyDraftKey(){
  return 'gongji_daily_draft_' + (currentUser || 'guest');
}
function saveDailyDraft(){
  const content = $('#f-content');
  if(!content || !currentUser) return;
  const draft = {
    date: $('#f-date')?.value || todayStr(),
    project: $('#f-project')?.value || '',
    category: $('#f-category')?.value || CATEGORIES[0],
    customCategory: $('#f-category-name')?.value || '',
    rememberCategory: $('#f-category-remember')?.checked || false,
    hours: $('#f-hours')?.value || '',
    status: segVal('f-status') || '已完成',
    content: content.value || ''
  };
  try{
    const meaningful = draft.content.trim() || draft.project.trim() || draft.hours || draft.customCategory.trim() || draft.date !== todayStr();
    userSettings().draft = meaningful ? draft : null;
    userSettings().draftUpdatedAt = Date.now();
    if(meaningful){
      localStorage.setItem(dailyDraftKey(), JSON.stringify(draft));
    }else{
      localStorage.removeItem(dailyDraftKey());
    }
  }catch(e){}
  persistUserState();
}
function restoreDailyDraft(){
  try{
    const settings = userSettings();
    const raw = localStorage.getItem(dailyDraftKey());
    const d = Object.prototype.hasOwnProperty.call(settings, 'draft') ? settings.draft : (raw && JSON.parse(raw));
    if(!d) return;
    if(!settings.draftUpdatedAt){ settings.draft = d; settings.draftUpdatedAt = Date.now(); }
    if($('#f-date')) $('#f-date').value = d.date || todayStr();
    if($('#f-project')) $('#f-project').value = d.project || '';
    if($('#f-category')) $('#f-category').innerHTML = categoryOptions(d.category || CATEGORIES[0]);
    if($('#f-category-name')) $('#f-category-name').value = d.customCategory || '';
    if($('#f-category-remember')) $('#f-category-remember').checked = !!d.rememberCategory;
    if($('#f-category-custom')) $('#f-category-custom').hidden = $('#f-category').value !== '其他';
    if($('#f-hours')) $('#f-hours').value = d.hours || '';
    if($('#f-content')) $('#f-content').value = d.content || '';
    const status = $('#f-status');
    if(status && d.status){
      $$('button', status).forEach(b => b.classList.toggle('active', b.dataset.v === d.status));
    }
  }catch(e){}
}
function clearDailyDraft(){
  try{ localStorage.removeItem(dailyDraftKey()); }catch(e){}
  if(currentUser){ userSettings().draft = null; userSettings().draftUpdatedAt = Date.now(); }
}

/* ========== 统计聚合 ========== */
function projStats(entries){
  const m = new Map();
  entries.forEach(e => {
    const p = e.project || '未分类';
    if(!m.has(p)) m.set(p, { project:p, count:0, hours:0, items:[] });
    const s = m.get(p);
    s.count++; s.hours += Number(e.hours) || 0; s.items.push(e);
  });
  const arr = Array.from(m.values());
  arr.forEach(s => {
    s.hours = Math.round(s.hours * 10) / 10;
    s.items.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt || 0) - (b.createdAt || 0));
  });
  arr.sort((a, b) => b.count - a.count);
  return arr;
}
function catStats(entries){
  const m = new Map();
  entries.forEach(e => { const c = e.category || '其他'; m.set(c, (m.get(c) || 0) + 1); });
  return Array.from(m.entries()).sort((a, b) => b[1] - a[1]);
}
function barsHtml(st){
  if(!st.length) return '<p class="hint">暂无数据</p>';
  const max = Math.max(...st.map(s => s.hours || s.count), 1);
  return `<div class="bars">${st.map(s => {
    const v = s.hours || s.count;
    return `<div class="bar-row">
      <span class="bar-name">${esc(s.project)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(v / max * 100, 2)}%;--ph:${hue(s.project)}"></div></div>
      <span class="bar-val">${s.hours ? s.hours + 'h · ' : ''}${s.count} 条</span>
    </div>`;
  }).join('')}</div>`;
}

/* ========== 周报文字生成 ========== */
function weeklyText(entries, start, end, label = '周报'){
  const a = fmtDate(start), b = fmtDate(end);
  const L = [`【${label}】${a} ~ ${b}`];
  if(!entries.length){ L.push(''); L.push('本周暂无工作记录。'); return L.join('\n'); }
  const total = entries.length;
  const hours = sumHours(entries);
  const ps = projStats(entries);
  const cnOrd = '一二三四五六七八九十';
  L.push('');
  L.push(`■ 本周概览：共 ${total} 条记录 · 约 ${hours} 小时 · 涉及 ${ps.length} 个项目`);
  L.push(`■ 项目投入：${ps.map(s => `${s.project} ${s.hours || 0}h`).join(' · ')}`);
  ps.forEach((s, i) => {
    L.push('');
    L.push(`${i < 10 ? cnOrd[i] : i + 1}、${s.project}（${s.count} 条 · ${s.hours || 0}h）`);
    s.items.forEach((e, j) => {
      L.push(`  ${j + 1}. [${shortDate(e.date)} 周${WD_CN[parseDate(e.date).getDay()]}·${e.category || '其他'}] ${condense(e.content)}`);
    });
  });
  const doing = entries.filter(e => e.status !== '已完成');
  L.push('');
  if(doing.length){
    L.push('■ 进行中 / 待跟进');
    doing.forEach(e => L.push(`  · [${e.project || '未分类'}] ${condense(e.content)}`));
  }else{
    L.push('■ 本周记录的事项均已完成');
  }
  return L.join('\n');
}

/* ========== 月报文字生成 ========== */
function monthlyText(entries, first, last, mode){
  const ym = `${first.getFullYear()}年${first.getMonth() + 1}月`;
  const L = [];
  if(!entries.length) return `【月度工作汇报】${ym}\n\n本月暂无工作记录。`;
  const total = entries.length;
  const hours = sumHours(entries);
  const ps = projStats(entries);
  const cs = catStats(entries);
  if(mode === 'brief'){
    L.push(`【月度汇报 · 精简版】${ym}`);
    L.push('');
    ps.forEach((s, i) => {
      const pts = s.items.slice(0, 3).map(e => condense(e.content, 36)).join('、');
      L.push(`${i + 1}. ${s.project}：完成${pts}${s.items.length > 3 ? `等 ${s.items.length} 项工作` : `（共 ${s.items.length} 项）`}，投入约 ${s.hours || 0} 小时`);
    });
    const doing = entries.filter(e => e.status !== '已完成');
    if(doing.length) L.push(`另有 ${doing.length} 项工作仍在进行中，将于下月继续推进。`);
    return L.join('\n');
  }
  L.push(`【月度工作汇报】${ym}（${fmtDate(first)} ~ ${fmtDate(last)}）`);
  L.push('');
  L.push(`一、本月概览：共 ${total} 条工作记录，累计约 ${hours} 小时，涉及 ${ps.length} 个项目。`);
  L.push(`分类分布：${cs.map(([c, n]) => `${c} ${pct(n, total)}%`).join(' · ')}`);
  L.push('');
  L.push('二、主要工作（按项目）');
  ps.forEach((s, i) => {
    L.push(`${i + 1}. ${s.project}（${s.count} 条 · ${s.hours || 0}h · 占比 ${pct(s.count, total)}%）`);
    s.items.slice(0, 8).forEach(e => L.push(`   · [${shortDate(e.date)}] ${condense(e.content)}`));
    if(s.items.length > 8) L.push(`   · ……另有 ${s.items.length - 8} 条记录`);
  });
  const doing = entries.filter(e => e.status !== '已完成');
  L.push('');
  if(doing.length){
    L.push('三、延续到下月的事项');
    doing.forEach(e => L.push(`  · [${e.project || '未分类'}] ${condense(e.content)}`));
  }else{
    L.push('三、收尾情况');
    L.push('  本月记录的事项均已完成。');
  }
  return L.join('\n');
}

/* ========== AI 润色 ========== */
const AI_BRIDGE = 'http://127.0.0.1:17654';
let aiBridgeStartTask = null;
let aiBridgeProbe = 0;
function aiOpenLauncher(){
  window.location.href = 'gongji-ai://start';
}
async function aiStartBridge(timeout=15000){
  if(aiBridgeStartTask) return aiBridgeStartTask;
  aiBridgeProbe++;
  // Keep the OS launch in the original click so the browser can request permission.
  aiOpenLauncher();
  aiBridgeStartTask = (async () => {
    const deadline = Date.now() + timeout;
    const signal = AbortSignal.timeout(timeout);
    while(Date.now() < deadline){
      try{
        if(await aiBridgeToken(signal)) return;
      }catch(e){
        if(!signal.aborted) throw e;
        break;
      }
      await new Promise(resolve => setTimeout(resolve, 350));
    }
    throw new Error('未能启动本机服务。请允许浏览器打开「工记 AI」；此电脑首次使用或项目移动目录后，需运行一次「启动AI助手.cmd」完成网页启动配置。');
  })().finally(() => { aiBridgeStartTask = null; });
  return aiBridgeStartTask;
}
async function refreshAIServiceStatus(){
  const status = $('#ai-service-status');
  const button = $('#btn-ai-start');
  if(!status || !button || aiBridgeStartTask) return;
  const probe = ++aiBridgeProbe;
  const token = await aiBridgeToken(AbortSignal.timeout(2000));
  if(!status.isConnected || aiBridgeStartTask || probe !== aiBridgeProbe) return;
  status.textContent = token ? '本机 AI 服务已就绪' : '本机 AI 服务未启动';
  $('#ai-service-dot').className = 'ds-dot ' + (token ? 'green' : 'amber');
  button.disabled = !!token;
}
function offerAIServiceStart(error, retry){
  if(!error.needsBridge) return;
  const owner = currentUser;
  openModal(`
    <div class="modal-head"><h3>启动本机 AI 服务</h3></div>
    <div class="modal-body"><p class="modal-text" id="ai-launch-status">本机服务尚未运行，启动后将继续本次 AI 请求。</p></div>
    <div class="modal-foot">
      <button class="btn ghost" id="ai-launch-cancel">取消</button>
      <button class="btn primary" id="ai-launch-confirm">${icon('sparkles', 15)}启动并继续</button>
    </div>`, false);
  $('#ai-launch-cancel').onclick = closeModal;
  $('#ai-launch-confirm').onclick = async ev => {
    const button = ev.currentTarget;
    const status = $('#ai-launch-status');
    button.disabled = true;
    status.textContent = '正在等待本机服务启动…';
    try{
      await aiStartBridge();
      if(!status.isConnected || currentUser !== owner) return;
      closeModal();
      refreshAIServiceStatus();
      retry();
    }catch(e){
      if(status.isConnected) status.textContent = e.message;
    }finally{ button.disabled = false; }
  };
}
function aiConfigFromForm(){
  return {
    enabled:$('#ai-toggle').checked,
    baseUrl:$('#ai-base').value.trim(),
    apiKey:$('#ai-key').value.trim(),
    model:$('#ai-model').value.trim(),
    protocol:$('#ai-protocol').value,
    transport:$('#ai-transport').value
  };
}
function aiBases(cfg){
  let url;
  try{ url = new URL(cfg.baseUrl); }catch(e){ throw new Error('接口地址无效，请填写完整的 http:// 或 https:// 地址'); }
  if(!['https:', 'http:'].includes(url.protocol) || url.username || url.password || url.search || url.hash){
    throw new Error('接口地址仅支持 HTTP / HTTPS，请移除用户名、密码、查询参数和片段');
  }
  const base = url.href.replace(/\/+$/, '').replace(/\/(?:chat\/completions|responses|models)$/, '');
  return [...new Set([base, /\/v1$/.test(base) ? base.slice(0, -3) : base + '/v1'])];
}
function aiError(message, status=0, endpointMismatch=false){
  return Object.assign(new Error(message), { status, endpointMismatch });
}
function aiErrorText(error, apiKey=''){
  if(['AbortError','TimeoutError'].includes(error.name)) return '请求超时，请稍后重试';
  if(error.needsBridge) return '本机 AI 服务未启动，可在网页中启动后继续';
  if(error instanceof TypeError) return '浏览器无法连接接口，请检查网络，或在设置中启动本机 AI 服务后使用自动连接';
  const message = error.message || String(error);
  return apiKey ? message.split(apiKey).join('[API Key]') : message;
}
async function aiBridgeToken(signal){
  const timeout = AbortSignal.timeout(1200);
  try{
    const res = await fetch(AI_BRIDGE + '/health', {
      signal:AbortSignal.any([signal, timeout]), cache:'no-store', credentials:'omit', referrerPolicy:'no-referrer'
    });
    const info = await res.json();
    return res.ok && info.app === 'gongji-ai-bridge' && info.version === 1 && typeof info.token === 'string' ? info.token : null;
  }catch(e){
    if(signal.aborted) throw e;
    return null;
  }
}
function aiDecode(text){
  try{ return JSON.parse(text); }catch(e){}
  // Some compatible gateways return SSE even when a non-streaming reply was requested.
  let combined = '', final = null;
  for(const line of text.split(/\r?\n/)){
    if(!line.startsWith('data:')) continue;
    const data = line.slice(5).trim();
    if(!data || data === '[DONE]') continue;
    let event;
    try{ event = JSON.parse(data); }catch(e){ continue; }
    if(event.error || event.type === 'error') throw new Error(event.error?.message || event.message || '接口返回错误');
    if(event.type === 'response.failed') throw new Error(event.response?.error?.message || '模型生成失败');
    if(event.response && ['response.completed','response.incomplete'].includes(event.type)) final = event.response;
    if(event.type === 'response.output_text.delta') combined += event.delta || '';
    const delta = event.choices?.[0]?.delta?.content;
    if(typeof delta === 'string') combined += delta;
  }
  if(final) return final;
  if(combined) return { output_text:combined };
  return null;
}
async function aiRequest(cfg, url, body, signal, token){
  let res, raw;
  try{
    res = await fetch(token ? AI_BRIDGE + '/request' : url, {
    method:token || body ? 'POST' : 'GET', signal, cache:'no-store', credentials:'omit', referrerPolicy:'no-referrer',
    headers:token
      ? { 'Content-Type':'application/json', 'X-Gongji-Token':token }
      : { ...(body ? { 'Content-Type':'application/json' } : {}), 'Authorization':'Bearer ' + cfg.apiKey },
    ...(token ? { body:JSON.stringify({ url, apiKey:cfg.apiKey, body }) } : body ? { body:JSON.stringify(body) } : {})
    });
    raw = await res.text();
  }catch(e){
    if(cfg.transport !== 'direct' && e instanceof TypeError) e.needsBridge = true;
    throw e;
  }
  let data;
  try{ data = aiDecode(raw); }catch(e){ if(res.ok) throw e; }
  if(!res.ok){
    const detail = data?.error?.message || data?.message || (typeof data?.error === 'string' ? data.error : '');
    const hint = { 401:'API Key 无效或已过期', 403:'接口拒绝访问，请检查 Key 权限或访问限制', 404:'接口路径或模型不存在',
      429:'请求过于频繁或额度不足', 502:'上游服务连接失败', 503:'模型服务暂不可用' }[res.status] || '接口请求失败';
    const safeDetail = String(detail).split(cfg.apiKey).join('[API Key]').slice(0, 350);
    throw aiError(`HTTP ${res.status}：${safeDetail || hint}`, res.status);
  }
  if(!data) throw aiError('接口返回了非 JSON 数据，请检查接口地址是否为 API 地址', res.status, true);
  if(data.error) throw aiError(data.error.message || String(data.error), res.status);
  return data;
}
async function aiConnection(cfg, signal){
  if(!cfg.apiKey) throw new Error('请填写 API Key');
  if(cfg.transport === 'direct') return null;
  const token = await aiBridgeToken(signal);
  if(!token && cfg.transport === 'local') throw Object.assign(new Error('本机 AI 服务未启动'), { needsBridge:true });
  return token;
}
function aiCanTryNext(error){
  return error.endpointMismatch || [404,405,501].includes(error.status) ||
    (error.status === 400 && /unsupported|not supported|not implemented|responses|chat.?completions|不支持|input.*required/i.test(error.message));
}
function aiReplyText(data){
  if(data.status === 'failed') throw new Error(data.error?.message || '模型生成失败');
  if(data.status === 'incomplete') throw new Error('模型回复未完成，请重试或更换模型');
  const content = data.choices?.[0]?.message?.content;
  if(typeof content === 'string') return content.trim();
  if(Array.isArray(content)) return content.map(part => part?.text || '').join('').trim();
  if(typeof data.output_text === 'string') return data.output_text.trim();
  return (Array.isArray(data.output) ? data.output : []).flatMap(item => item?.type === 'message' ? item.content || [] : [])
    .filter(part => part?.type === 'output_text').map(part => part.text || '').join('').trim();
}
async function aiChat(cfg, userText, sys){
  if(!cfg.model) throw new Error('请先填写模型名称，或点击「获取模型」后选择');
  const bases = aiBases(cfg);
  const signal = AbortSignal.timeout(120000);
  const token = await aiConnection(cfg, signal);
  const protocol = cfg.protocol || 'auto';
  const preferResponses = /\/responses\/?$/.test(cfg.baseUrl);
  const protocols = protocol === 'auto'
    ? (preferResponses ? ['responses','chat'] : ['chat','responses']) : [protocol];
  let lastError;
  for(const base of bases){
    for(const type of protocols){
      const endpoint = type === 'responses' ? 'responses' : 'chat/completions';
      const body = type === 'responses'
        ? { model:cfg.model, store:false, stream:false,
            input:[{ role:'system', content:sys }, { role:'user', content:userText }] }
        : { model:cfg.model, stream:false, messages:[{ role:'system', content:sys }, { role:'user', content:userText }] };
      try{
        const data = await aiRequest(cfg, base + '/' + endpoint, body, signal, token);
        const text = aiReplyText(data);
        if(!text) throw new Error('模型没有返回文字，请确认所选模型支持文本对话');
        return text;
      }catch(e){
        if(!aiCanTryNext(e)) throw e;
        lastError = e;
      }
    }
  }
  throw lastError;
}
async function aiModels(cfg){
  const signal = AbortSignal.timeout(30000);
  const bases = aiBases(cfg);
  const token = await aiConnection(cfg, signal);
  let lastError;
  for(const base of bases){
    try{
      const data = await aiRequest(cfg, base + '/models', null, signal, token);
      if(!Array.isArray(data.data)) throw new Error('接口未返回可用模型列表，仍可手动填写模型名称');
      const models = [...new Set(data.data.map(item => item?.id).filter(id => typeof id === 'string' && id.trim()))].sort();
      if(!models.length) throw new Error('此 Key 的模型列表为空，仍可手动填写服务商提供的模型名称');
      return models;
    }catch(e){
      if(!aiCanTryNext(e)) throw e;
      lastError = e;
    }
  }
  throw lastError;
}
async function runAI(kind, btn, reportText, apply){
  const cfg = { ...currentSettings().ai };
  const owner = currentUser;
  if(!cfg.enabled){ toast('请先在「设置 → AI 大模型」中开启并保存配置', 'info'); return; }
  if(!cfg.baseUrl || !cfg.apiKey){ toast('AI 配置不完整：请填写接口地址与 API Key', 'error'); return; }
  const old = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = icon('sparkles', 14) + '生成中…';
  try{
    const sys = kind === 'weekly'
      ? '你是一名专业的工作汇报写作助手。用户会提供一份按项目分组的一周工作记录总结，请将其改写成流畅、专业、突出成果与进展的中文周报正文：使用「本周完成」「进行中」等小节和简短分点，总字数约 200-300 字，直接输出正文内容，不要任何解释或开场白。'
      : '你是一名专业的工作汇报写作助手。用户会提供一份按项目分组的月度工作记录总结，请将其改写成适合直接粘贴到汇报 PPT 的中文月度总结：先给一句整体概括，再按项目用短句列出主要成果（每项 1-2 行），最后如有未完成事项用一句话说明。直接输出正文内容，不要任何解释。';
    const txt = await aiChat(cfg, '原始总结：\n' + reportText, sys);
    if(currentUser !== owner || !btn.isConnected) return;
    apply(txt);
    toast('AI 润色完成', 'success');
  }catch(e){
    if(currentUser === owner && btn.isConnected){
      toast('AI 请求失败：' + aiErrorText(e, cfg.apiKey), 'error');
      offerAIServiceStart(e, () => { if(btn.isConnected) btn.click(); });
    }
  }finally{
    btn.disabled = false;
    btn.innerHTML = old;
  }
}

function dsStatusHtml(){

/* ========== 视图调度 ========== */
function updateNav(){
  $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === view));
}
function renderView(){
  updateNav();
  try {
    if(view === 'daily') buildDaily();
    else if(view === 'weekly') renderWeekly();
    else if(view === 'monthly') renderMonthly();
    else renderSettings();
  } catch(err){
    console.error('[render]', err);
    const root = $('#view-root');
    if(root) root.innerHTML = `<div class="card" style="padding:32px;text-align:center"><h2 style="margin:0 0 8px">页面渲染出错</h2><p class="sub" style="margin:0 0 16px">${String((err && err.message) || err)}</p><button class="btn primary" data-nav="v-retry">重新加载</button></div>`;
  }
  updateNav();
}
function refreshApp(){
  if(!currentUser || !blob.accounts[currentUser]) return;
  updateChrome();
  if(view === 'settings'){
    updateDataStatus();
    return;
  }
  if(view === 'daily'){ updateDaily(); return; }
  renderView();
}
function updateChrome(){
  const badge = $('#nav-badge');
  if(badge){
    const t = todayStr();
    const n = myRecords().filter(e => e.date === t).length;
    badge.textContent = n;
    badge.style.display = n ? '' : 'none';
  }
  $('#user-name').textContent = currentAccount().displayName || currentAccount().name;
  $('#user-avatar').textContent = (currentAccount().displayName || '用').slice(0, 1);
  updateDataStatus();
}

function wireShell(){
  $('#storage-location').onclick = () => { view = 'settings'; renderView(); };
  $$('.nav-item').forEach(b => b.addEventListener('click', () => {
    const target = b.dataset.view;
    if(target === view) return;
    view = target;
    if(view === 'weekly'){ weekMode = 'week'; weekOffset = 0; customRange = null; }
    if(view === 'monthly'){ const n = new Date(); monthY = n.getFullYear(); monthM = n.getMonth() + 1; }
    renderView();
  }));
  $('#theme-btn').addEventListener('click', cycleTheme);
  $('#logout-btn').addEventListener('click', logout);
  $('#view-root').addEventListener('click', e => {
    const es = e.target.closest('[data-es]');
    if(es){
      dailyFilter.range = es.dataset.es;
      const chips = $('#range-chips');
      if(chips) $$('button', chips).forEach(x => x.classList.toggle('active', x.dataset.range === dailyFilter.range));
      renderDailyList();
      return;
    }
    const btn = e.target.closest('[data-act]');
    if(!btn) return;
    const holder = btn.closest('[data-id]');
    if(!holder) return;
    const rec = myRecords().find(r => r.id === holder.dataset.id);
    if(!rec) return;
    if(btn.dataset.act === 'edit') openEntryModal(rec);
    else if(btn.dataset.act === 'del') confirmDeleteEntry(rec);
  });
  $('#view-root').addEventListener('click', e => {
    const btn = e.target.closest('[data-nav]');
    if(!btn) return;
    const act = btn.dataset.nav;
    if(act === 'w-prev' || act === 'w-next'){
      const dir = act === 'w-prev' ? -1 : 1;
      if(weekMode === 'custom' && customRange){
        const s = parseDate(customRange.start), en = parseDate(customRange.end);
        const span = Math.max(1, Math.round((en - s) / 86400000) + 1);
        s.setDate(s.getDate() + dir * span);
        en.setDate(en.getDate() + dir * span);
        customRange = { start: fmtDate(s), end: fmtDate(en) };
      } else {
        weekOffset += dir;
      }
      renderWeekly();
    } else if(act === 'w-now'){
      if(weekMode === 'custom'){ weekMode = 'week'; customRange = null; }
      weekOffset = 0;
      renderWeekly();
    } else if(act === 'wr-apply'){
      const sEl = $('#wr-start'), eEl = $('#wr-end');
      if(!sEl || !eEl || !sEl.value || !eEl.value){ toast('请先选择开始和结束日期', 'warn'); return; }
      if(parseDate(sEl.value) > parseDate(eEl.value)){ toast('开始日期不能晚于结束日期', 'warn'); return; }
      weekMode = 'custom';
      customRange = { start: sEl.value, end: eEl.value };
      renderWeekly();
    } else if(act === 'm-prev' || act === 'm-next'){
      monthM += (act === 'm-prev' ? -1 : 1);
      if(monthM < 1){ monthM = 12; monthY--; }
      if(monthM > 12){ monthM = 1; monthY++; }
      renderMonthly();
    } else if(act === 'm-now'){
      const n = new Date();
      monthY = n.getFullYear(); monthM = n.getMonth() + 1;
      renderMonthly();
    } else if(act === 'v-retry'){
      renderView();
    }
  });
  $('#view-root').addEventListener('change', e => {
    if(e.target && e.target.id === 'm-month'){
      const m = /^(\d{4})-(\d{2})$/.exec(e.target.value || '');
      if(!m) return;
      monthY = +m[1]; monthM = +m[2];
      renderMonthly();
    }
  });
  $('#modal-root').addEventListener('click', e => {
    if(e.target.classList.contains('overlay') && e.target.dataset.dismiss === '1') closeModal();
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
  $('#import-file').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!f) return;
    try{
      const textContent = await f.text();
      if(!textContent.trim()) throw new Error('文件为空');
      const data = JSON.parse(textContent);
      const normalized = normalizeImportData(data);
      const accountCount = Object.keys(normalized.accounts || {}).length;
      const recordCount = Object.values(normalized.records || {}).reduce((sum, rows) => sum + (Array.isArray(rows) ? rows.length : 0), 0);
      if(accountCount === 0 && recordCount === 0) throw new Error('文件中没有可导入的账号或工作记录');
      importChoiceModal(normalized);
    }catch(err){
      console.error('[import JSON]', err);
      toast('导入失败：' + (err.message || err), 'error');
    }
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(currentTheme() === 'auto') applyTheme(); });
  const syncIfActive = () => {
    if(currentUser && fileConnected && !document.hidden) syncFromFile();
  };
  window.addEventListener('focus', () => {
    syncIfActive();
    if(currentUser && view === 'settings') refreshAIServiceStatus();
  });
  document.addEventListener('visibilitychange', syncIfActive);
  setInterval(syncIfActive, 30000);
}
async function init(){
  wireAuth();
  wireShell();
  blob = migrate(loadLS() || defaultBlob());
  Object.keys(blob.accounts).forEach(user => {
    const settings = userSettings(user);
    if(Object.prototype.hasOwnProperty.call(settings, 'draft')) return;
    try{
      const raw = localStorage.getItem('gongji_daily_draft_' + user);
      if(raw){ settings.draft = JSON.parse(raw); settings.draftUpdatedAt = Date.now(); }
    }catch(e){}
  });
  const s = blob.settings.session;
  if(s && s.expires > Date.now() && blob.accounts[s.user]){
    currentUser = s.user;
    await restoreFileHandle(currentUser);
    if(fileConnected) saveLS();
    applyTheme();
    enterApp();
  }else{
    if(s){ blob.settings.session = null; saveLS(); }
    showAuth();
  }
}
document.addEventListener('DOMContentLoaded', init);
</script>
